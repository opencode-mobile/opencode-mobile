<!doctype html>
<!--
  PROTOTYPE — Remove project from home (Session List only).

  Question: what should the remove-project flow look like on home?
  Scope decision: only the Session List home mode is in play.

  Iteration 2: A (dock overflow) scrapped — hard no. B (chip long-press)
  scrapped. C (× on chips) kept. New: D (manage/edit mode) and
  E (drag chip up to a Remove target). Switch with ?variant= (C | D | E)
  or the floating bar / arrow keys.

  Throwaway. Not for production.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remove project — Session List flow prototype</title>
<style>
  :root {
    --page-bg: #e9e9ef;
    --phone-bg: #F8F8F8;
    --surface: #F8F8F8;
    --surface-hover: #0000000A;
    --text-strong: #171717;
    --text-base: #6F6F6F;
    --text-weaker: #A0A0A0;
    --border-weaker: #E8E8E8;
    --border: #DDDDDD;
    --error: #FC533A;
    --error-soft: #FFF0EC;
    --tile-bg: #EFEFEF;
    --scrim: rgba(0,0,0,0.32);
    --bar: #171717;
    --bar-text: #F5F5F5;
    --accent-violet-fill: #4C3D5C; --accent-violet-tint: #E2D5F5;
    --accent-teal-fill: #2D4A42;   --accent-teal-tint: #B8F5E0;
    --accent-amber-fill: #5C3D28;  --accent-amber-tint: #FFB86C;
  }
  html[data-theme="dark"] {
    --page-bg: #101010;
    --phone-bg: #1C1C1C;
    --surface: #1C1C1C;
    --surface-hover: #FFFFFF0D;
    --text-strong: #EDEDED;
    --text-base: #A0A0A0;
    --text-weaker: #7A7A7A;
    --border-weaker: #232323;
    --border: #2E2E2E;
    --error: #FC533A;
    --error-soft: #3A201A;
    --tile-bg: #242424;
    --scrim: rgba(0,0,0,0.55);
    --bar: #F5F5F5;
    --bar-text: #171717;
    --accent-violet-fill: #3A2F47; --accent-violet-tint: #D8C8EE;
    --accent-teal-fill: #243832;   --accent-teal-tint: #A8EDD8;
    --accent-amber-fill: #4A3224;  --accent-amber-tint: #FFAA55;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--page-bg);
    color: var(--text-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 16px 110px 16px;
  }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }

  .page-title { text-align: center; max-width: 540px; }
  .page-title h1 { font-size: 18px; margin: 0 0 2px 0; }
  .page-title p { margin: 0; color: var(--text-base); font-size: 13px; }

  .page-tools { display: flex; gap: 10px; align-items: center; }
  .page-tools button {
    font: inherit; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-strong); border-radius: 999px; padding: 5px 12px;
  }

  .state-line {
    font-size: 11px; color: var(--text-base); font-family: ui-monospace, Menlo, monospace;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 10px; max-width: 540px; text-align: center;
  }

  /* ---------- phone ---------- */

  .phone {
    width: 390px; max-width: 100%;
    height: 780px; max-height: 82vh;
    background: var(--phone-bg);
    border-radius: 40px;
    border: 8px solid #101010;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  html[data-theme="dark"] .phone { border-color: #000; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px 16px;
  }
  .topbar .title { font-size: 15px; font-weight: 700; }
  .topbar .iconbtn {
    width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; color: var(--text-base);
    background: var(--tile-bg); cursor: pointer; font-size: 16px; border: none;
  }

  .app-content { flex: 1; overflow: hidden; position: relative; }

  /* ---------- session rows + time ladder (matches production OPE-107) ---------- */

  .session-scroll { height: 100%; overflow-y: auto; padding: 4px 0 150px; }

  .row { padding: 11px 16px; display: flex; align-items: center; gap: 10px; cursor: default; }
  .row .mid { flex: 1; min-width: 0; }
  .row .title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .subtitle { font-size: 11px; color: var(--text-base); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .row .caption { font-size: 10px; color: var(--text-weaker); text-align: right; }
  .badge {
    position: relative; width: 32px; height: 32px; flex: 0 0 auto; border-radius: 50%;
    display: grid; place-items: center; font-weight: 800; font-size: 13px;
  }
  .badge .status-dot {
    position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px;
    border-radius: 50%; border: 2px solid var(--phone-bg);
  }
  .dot-running { background: var(--interactive); }
  .dot-ready { background: #2FA36B; }
  .dot-idle { background: var(--text-weaker); }
  .row-divider { border: 0; border-top: 1px solid var(--border-weaker); margin: 0 0 0 58px; }
  .status { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .status.idle { background: var(--tile-bg); color: var(--text-base); }
  .status.running { background: #E8F1FF; color: #0A5CFF; }
  html[data-theme="dark"] .status.running { background: #16263F; color: #7AA7FF; }

  /* Uppercase caption header — matches SessionListSectionHeader on both apps. */
  .section-head {
    padding: 16px 16px 6px; font-size: 12px; font-weight: 600;
    letter-spacing: 0.5px; color: var(--text-base);
  }

  /* ---------- dock ---------- */

  .dock {
    position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 20;
    background: var(--surface); border: 1px solid var(--border-weaker);
    border-radius: 16px; padding: 10px 12px; box-shadow: 0 10px 28px rgba(0,0,0,0.14);
  }
  .dock .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
  .chip {
    position: relative; flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-base); cursor: pointer;
    user-select: none;
  }
  .chip.active { background: var(--tile-bg); color: var(--text-strong); }
  .chip .count { color: var(--text-weaker); font-weight: 500; }
  .chip .chip-x {
    width: 14px; height: 14px; border-radius: 50%; background: var(--tile-bg);
    color: var(--text-base); font-size: 9px; line-height: 1; display: grid; place-items: center;
    cursor: pointer;
  }
  .chip .chip-x.warn { background: var(--error-soft); color: var(--error); }
  .chip.dragging { opacity: 0.55; }
  .dock .hint { font-size: 10px; color: var(--text-weaker); text-align: center; padding-bottom: 8px; }

  .dock .cta-row { display: flex; gap: 8px; align-items: center; }
  .dock .cta {
    height: 40px; border-radius: 999px; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--text-strong); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .dock .cta.add { width: 40px; font-size: 18px; color: var(--text-base); }
  .dock .cta.new { flex: 1; }
  .dock .cta.manage { color: var(--text-base); padding: 0 16px; }
  .dock .cta.manage.active { color: var(--error); border-color: var(--error); }

  /* ---------- remove drop target (variant E) ---------- */

  .drop-target {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 35; display: flex; align-items: center; gap: 8px;
    background: var(--error); color: #fff; border-radius: 999px;
    padding: 10px 18px; font-size: 13px; font-weight: 700;
    box-shadow: 0 8px 24px rgba(0,0,0,0.28); pointer-events: none;
    animation: dropIn .15s ease-out;
  }
  .drop-target.hot { outline: 3px solid #fff; outline-offset: 2px; transform: translateX(-50%) scale(1.06); }
  @keyframes dropIn { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* ---------- empty state ---------- */

  .empty {
    height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; text-align: center; padding: 24px;
  }
  .empty .t { font-size: 15px; font-weight: 700; }
  .empty .s { font-size: 12px; color: var(--text-base); max-width: 240px; }
  .empty button {
    margin-top: 8px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--tile-bg); color: var(--text-strong); border: none;
    border-radius: 999px; padding: 9px 18px;
  }

  /* ---------- dialog ---------- */

  .scrim {
    position: absolute; inset: 0; background: var(--scrim); z-index: 40;
    display: grid; place-items: center; padding: 24px;
  }
  .dialog {
    width: 100%; max-width: 320px; background: var(--surface);
    border-radius: 16px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .dialog h2 { margin: 0 0 8px 0; font-size: 15px; }
  .dialog p { margin: 0 0 18px 0; font-size: 13px; color: var(--text-base); line-height: 1.45; }
  .dialog .actions { display: flex; gap: 8px; }
  .dialog .actions button {
    flex: 1; height: 40px; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .dialog .cancel { background: var(--tile-bg); color: var(--text-strong); border: none; }
  .dialog .remove { background: var(--error); color: #fff; border: none; }

  /* ---------- snackbar ---------- */

  .snackbar {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 50; background: var(--bar); color: var(--bar-text);
    font-size: 12px; font-weight: 600; padding: 9px 16px; border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25); white-space: nowrap;
    animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* ---------- floating variant bar ---------- */

  .variant-bar {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 90; display: flex; align-items: center; gap: 12px;
    background: var(--bar); color: var(--bar-text);
    border-radius: 999px; padding: 8px 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .variant-bar button {
    width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.14); color: inherit; font-size: 16px;
  }
  html[data-theme="dark"] .variant-bar button { background: rgba(0,0,0,0.18); }
  .variant-bar .label { font-size: 12px; font-weight: 700; min-width: 170px; text-align: center; }

  .variant-tag {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
    background: var(--error-soft); color: var(--error); border-radius: 4px;
    padding: 2px 6px; margin-left: 6px; vertical-align: middle;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="page-title">
    <h1>Remove project — Session List flow <span class="variant-tag" id="variantTag">PROTOTYPE</span></h1>
    <p id="questionLine">Question: what should the remove-project flow look like on home (Session List only)?</p>
  </div>
  <div class="page-tools">
    <button id="themeBtn" type="button">Toggle dark</button>
    <button id="resetBtn" type="button">Reset projects</button>
  </div>

  <div class="phone" id="phone">
    <div class="topbar">
      <span class="title">Sessions</span>
      <button class="iconbtn" type="button" title="Settings">⚙</button>
    </div>
    <div class="app-content" id="appContent"></div>
  </div>

  <div class="state-line" id="stateLine"></div>
  <div class="page-tools">
    <span style="font-size:11px;color:var(--text-base)">Mock — no server, no persistence.</span>
  </div>
</div>

<div class="variant-bar">
  <button id="prevBtn" type="button" aria-label="Previous variant">‹</button>
  <span class="label" id="variantLabel">C — × on chips</span>
  <button id="nextBtn" type="button" aria-label="Next variant">›</button>
</div>

<script>
"use strict";

/* ============================================================
   State
   ============================================================ */

const SEED = [
  { id: "opencode-mobile", name: "opencode-mobile", path: "~/Projects/opencode-mobile",
    letter: "O", accent: "violet",
    sessions: [
      { id: "s1", title: "Importing icons explanation", subtitle: "~/Projects/opencode-mobile", running: true, caption: "5m ago", bucket: "recent" },
      { id: "s2", title: "Material Design Icons integration plan", subtitle: "~/Projects/opencode-mobile", running: false, caption: "1h ago", bucket: "recent" },
      { id: "s3", title: "Review session list parity", subtitle: "~/Projects/opencode-mobile", running: false, caption: "Yesterday", bucket: "yesterday" },
    ] },
  { id: "playground", name: "playground", path: "~/Projects/playground",
    letter: "P", accent: "amber",
    sessions: [
      { id: "s4", title: "Try out the new theme resolver", subtitle: "~/Projects/playground", running: false, caption: "Today", bucket: "today" },
    ] },
  { id: "api-client", name: "api-client", path: "~/Projects/api-client",
    letter: "A", accent: "teal",
    sessions: [
      { id: "s5", title: "Wire up the SDK client generator", subtitle: "~/Projects/api-client", running: false, caption: "Jul 21 – 27", bucket: "week" },
    ] },
];

/* Bucket order mirrors HomeSessionLadder: Recent section → day sections → weeks. */
const LADDER_ORDER = ["recent", "today", "yesterday", "day", "week"];
const LADDER_TITLES = {
  recent: "Recent",
  today: "Today",
  yesterday: "Yesterday",
  day: "Wednesday, Jul 29",
  week: "Jul 21 – 27",
};

const ACCENTS = {
  violet: { fill: "var(--accent-violet-fill)", tint: "var(--accent-violet-tint)" },
  teal:   { fill: "var(--accent-teal-fill)",   tint: "var(--accent-teal-tint)" },
  amber:  { fill: "var(--accent-amber-fill)",  tint: "var(--accent-amber-tint)" },
};

const VARIANTS = {
  C: { key: "C", name: "× on chips", flow: "Always-visible × per chip → confirm. Riskiest for misclicks." },
  D: { key: "D", name: "Manage mode", flow: "Manage action arms chips with red ×; nothing removable in normal mode" },
  E: { key: "E", name: "Drag to remove", flow: "Drag a chip up onto the red Remove target; tap still filters" },
};

let state = {
  projects: JSON.parse(JSON.stringify(SEED)),
  filter: "all",            // "all" | project id (active filter chip)
  dialog: null,             // { id, name } confirm removal
  editMode: false,          // variant D
  snackbar: null,
};

/* Drag state for variant E — not part of UI state, transient only. */
const drag = { active: false, id: null, startX: 0, startY: 0, over: false };

/* ============================================================
   Actions
   ============================================================ */

function setFilter(id) { state.filter = id; render(); }

function requestRemove(id) {
  const p = state.projects.find(x => x.id === id);
  if (!p) return;
  state.dialog = { id, name: p.name };
  render();
}

function cancelRemove() {
  state.dialog = null;
  state.editMode = false;
  render();
}

function confirmRemove() {
  const { id } = state.dialog;
  const removedName = state.projects.find(p => p.id === id).name;
  state.projects = state.projects.filter(p => p.id !== id);
  if (state.filter === id) state.filter = "all";
  state.dialog = null;
  state.editMode = false;
  showSnackbar("Removed " + removedName + " from home");
  render();
}

function toggleManage() { state.editMode = !state.editMode; render(); }

function showSnackbar(text) {
  state.snackbar = text;
  render();
  clearTimeout(showSnackbar._t);
  showSnackbar._t = setTimeout(() => { state.snackbar = null; render(); }, 2200);
}

function resetProjects() {
  state.projects = JSON.parse(JSON.stringify(SEED));
  state.filter = "all";
  state.dialog = null;
  state.editMode = false;
  showSnackbar("Projects reset");
}

/* ============================================================
   Drag-to-remove (variant E)
   ============================================================ */

let dragTargetEl = null;

function showDropTarget(name) {
  const app = document.getElementById("appContent");
  const t = document.createElement("div");
  t.className = "drop-target";
  t.id = "dropTarget";
  t.innerHTML = "<span>🗑</span> Remove " + name;
  app.appendChild(t);
  dragTargetEl = t;
}

function hideDropTarget() { if (dragTargetEl) dragTargetEl.remove(); dragTargetEl = null; }

function dropTargetHot(x, y) {
  if (!dragTargetEl) return false;
  const r = dragTargetEl.getBoundingClientRect();
  return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
}

function attachDragRemove(el) {
  el.style.touchAction = "pan-x";
  el.addEventListener("pointerdown", e => {
    drag.active = true;
    drag.id = el.dataset.project;
    drag.startX = e.clientX;
    drag.startY = e.clientY;
    drag.over = false;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", e => {
    if (!drag.active) return;
    const dy = e.clientY - drag.startY;
    if (dy < -40) {
      const p = state.projects.find(x => x.id === drag.id);
      if (!dragTargetEl && p) showDropTarget(p.name);
      el.classList.add("dragging");
    }
    if (dragTargetEl) {
      const hot = dropTargetHot(e.clientX, e.clientY);
      dragTargetEl.classList.toggle("hot", hot);
      drag.over = hot;
    }
  });
  el.addEventListener("pointerup", e => {
    if (!drag.active) return;
    const wasDragging = !!dragTargetEl;
    hideDropTarget();
    el.classList.remove("dragging");
    const id = drag.id;
    drag.active = false;
    if (wasDragging) {
      if (drag.over && id) requestRemove(id);
    } else if (id) {
      setFilter(id);
    }
  });
  el.addEventListener("pointercancel", () => {
    hideDropTarget();
    drag.active = false;
  });
}

/* ============================================================
   Rendering
   ============================================================ */

function variant() { return currentVariantKey(); }

function allSessions() {
  const list = [];
  state.projects.forEach(p => p.sessions.forEach(s => list.push({ p, s })));
  return list;
}

function visibleSessions() {
  return state.filter === "all" ? allSessions() : allSessions().filter(x => x.p.id === state.filter);
}

function ladderSections(items) {
  const buckets = new Map();
  items.forEach(({ p, s }) => {
    const key = s.bucket || "week";
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push({ p, s });
  });
  return LADDER_ORDER
    .filter(k => buckets.has(k) && buckets.get(k).length > 0)
    .map(k => ({ bucket: k, items: buckets.get(k) }));
}

function render() {
  const app = document.getElementById("appContent");
  app.innerHTML = "";
  app.appendChild(state.projects.length === 0 ? renderEmpty() : renderList());
  if (state.snackbar) {
    const s = document.createElement("div");
    s.className = "snackbar";
    s.textContent = state.snackbar;
    app.appendChild(s);
  }
  if (state.dialog) app.appendChild(renderDialog());
  renderChrome();
  if (variant() === "E") {
    document.querySelectorAll(".chip[data-project]").forEach(attachDragRemove);
  }
}

function renderList() {
  const wrap = document.createElement("div");
  wrap.style.cssText = "height:100%;display:flex;flex-direction:column;";

  const scroll = document.createElement("div");
  scroll.className = "session-scroll";
  const items = visibleSessions();

  if (items.length === 0) {
    const row = document.createElement("div");
    row.className = "row empty-row";
    const mid = document.createElement("div");
    mid.className = "mid";
    const sub = document.createElement("div");
    sub.className = "subtitle";
    sub.textContent = "No recent sessions in this project";
    mid.appendChild(sub);
    row.appendChild(mid);
    scroll.appendChild(row);
  } else {
    ladderSections(items).forEach(section => {
      const isRecent = section.bucket === "recent";
      const head = document.createElement("div");
      head.className = "section-head";
      head.textContent = (LADDER_TITLES[section.bucket] || LADDER_TITLES.week).toUpperCase();
      scroll.appendChild(head);
      section.items.forEach(({ p, s }, i) => {
        scroll.appendChild(sessionRow(p, s, { statusDot: isRecent }));
        if (i < section.items.length - 1) {
          const divider = document.createElement("hr");
          divider.className = "row-divider";
          scroll.appendChild(divider);
        }
      });
    });
  }
  wrap.appendChild(scroll);

  wrap.appendChild(renderDock());
  return wrap;
}

function sessionRow(p, s, opts) {
  const row = document.createElement("div");
  row.className = "row";

  const badge = document.createElement("div");
  badge.className = "badge";
  badge.style.background = ACCENTS[p.accent].fill;
  badge.style.color = ACCENTS[p.accent].tint;
  badge.textContent = p.letter;
  if (opts && opts.statusDot) {
    const dot = document.createElement("span");
    dot.className = "status-dot dot-" + (s.running ? "running" : "idle");
    badge.appendChild(dot);
  }

  const mid = document.createElement("div");
  mid.className = "mid";
  const t = document.createElement("div");
  t.className = "title"; t.textContent = s.title;
  const sub = document.createElement("div");
  sub.className = "subtitle"; sub.textContent = s.subtitle;
  mid.appendChild(t); mid.appendChild(sub);

  const right = document.createElement("div");
  right.style.cssText = "display:flex;flex-direction:column;align-items:flex-end;gap:4px;";
  const cap = document.createElement("div");
  cap.className = "caption"; cap.textContent = s.caption;
  const st = document.createElement("span");
  st.className = "status " + (s.running ? "running" : "idle");
  st.textContent = s.running ? "Running" : "Idle";
  right.appendChild(cap); right.appendChild(st);

  row.appendChild(badge); row.appendChild(mid); row.appendChild(right);
  return row;
}

function renderDock() {
  const dock = document.createElement("div");
  dock.className = "dock";

  const chips = document.createElement("div");
  chips.className = "chips";
  const allCount = allSessions().length;

  const allChip = document.createElement("button");
  allChip.className = "chip" + (state.filter === "all" ? " active" : "");
  allChip.type = "button";
  allChip.innerHTML = "All <span class='count'>" + allCount + "</span>";
  allChip.addEventListener("click", () => setFilter("all"));
  chips.appendChild(allChip);

  state.projects.forEach(p => {
    const chip = document.createElement("button");
    chip.className = "chip" + (state.filter === p.id ? " active" : "");
    chip.type = "button";
    chip.dataset.project = p.id;
    const count = p.sessions.length;

    let x = "";
    if (variant() === "C" || (variant() === "D" && state.editMode)) {
      x = " <span class='chip-x" + (variant() === "D" ? " warn" : "") + "'>×</span>";
    }
    chip.innerHTML = p.name + " <span class='count'>" + count + "</span>" + x;

    if (x) {
      const xEl = chip.querySelector(".chip-x");
      xEl.addEventListener("click", ev => { ev.stopPropagation(); requestRemove(p.id); });
    }
    if (variant() === "D" && state.editMode) {
      chip.addEventListener("click", () => {}); // body tap inert in manage mode
    } else {
      chip.addEventListener("click", () => setFilter(p.id));
    }
    chips.appendChild(chip);
  });
  dock.appendChild(chips);

  if (variant() === "E") {
    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "Drag a project chip up to the Remove target";
    dock.appendChild(hint);
  }
  if (variant() === "D" && state.editMode) {
    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "Tap a red × to remove a project";
    dock.appendChild(hint);
  }

  const ctaRow = document.createElement("div");
  ctaRow.className = "cta-row";

  const addCta = document.createElement("button");
  addCta.className = "cta add"; addCta.type = "button"; addCta.textContent = "+";
  addCta.addEventListener("click", () => showSnackbar("Add project — not part of this prototype"));

  const newCta = document.createElement("button");
  newCta.className = "cta new"; newCta.type = "button"; newCta.textContent = "New session";
  newCta.addEventListener("click", () => showSnackbar("New session — not part of this prototype"));

  ctaRow.appendChild(addCta); ctaRow.appendChild(newCta);

  if (variant() === "D") {
    const manage = document.createElement("button");
    manage.className = "cta manage" + (state.editMode ? " active" : "");
    manage.type = "button";
    manage.textContent = state.editMode ? "Done" : "Manage";
    manage.addEventListener("click", toggleManage);
    ctaRow.appendChild(manage);
  }

  dock.appendChild(ctaRow);
  return dock;
}

function renderEmpty() {
  const e = document.createElement("div");
  e.className = "empty";
  const t = document.createElement("div"); t.className = "t"; t.textContent = "No projects yet";
  const s = document.createElement("div"); s.className = "s";
  s.textContent = "You removed everything. Add a project to see its sessions here.";
  const b = document.createElement("button"); b.type = "button"; b.textContent = "Add project";
  b.addEventListener("click", () => showSnackbar("Add project — not part of this prototype"));
  e.appendChild(t); e.appendChild(s); e.appendChild(b);
  return e;
}

function renderDialog() {
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.addEventListener("click", e => { if (e.target === scrim) cancelRemove(); });

  const d = document.createElement("div");
  d.className = "dialog";
  const h = document.createElement("h2");
  h.textContent = "Remove “" + state.dialog.name + "” from home?";
  const p = document.createElement("p");
  p.textContent = "Its sessions stay on the server. You can add the project again any time.";
  const actions = document.createElement("div");
  actions.className = "actions";

  const cancel = document.createElement("button");
  cancel.className = "cancel"; cancel.type = "button"; cancel.textContent = "Cancel";
  cancel.addEventListener("click", cancelRemove);

  const remove = document.createElement("button");
  remove.className = "remove"; remove.type = "button"; remove.textContent = "Remove";
  remove.addEventListener("click", confirmRemove);

  actions.appendChild(cancel); actions.appendChild(remove);
  d.appendChild(h); d.appendChild(p); d.appendChild(actions);
  scrim.appendChild(d);
  return scrim;
}

/* ============================================================
   Variant bar + theme + state line
   ============================================================ */

function currentVariantKey() {
  const raw = new URLSearchParams(location.search).get("variant") || "C";
  return raw.toUpperCase() in VARIANTS ? raw.toUpperCase() : "C";
}

function setVariant(key) {
  const url = new URL(location.href);
  url.searchParams.set("variant", key.toUpperCase());
  history.replaceState({}, "", url);
  state.dialog = null;
  state.editMode = false;
  hideDropTarget();
  render();
}

function renderChrome() {
  const key = variant();
  document.getElementById("variantLabel").textContent = key + " — " + VARIANTS[key].name;
  document.getElementById("variantTag").textContent = "PROTOTYPE · " + key;

  const projects = state.projects;
  const active = state.filter === "all" ? "all" : (projects.find(p => p.id === state.filter) || { name: "?" }).name;
  document.getElementById("stateLine").textContent =
    "state { projects: " + projects.length + " [" + projects.map(p => p.name).join(", ") + "] · " +
    "filter: " + active +
    (state.editMode ? " · manage: on" : "") +
    (state.dialog ? " · dialog: removing " + state.dialog.name : "") + " }";
}

function cycle(delta) {
  const keys = Object.keys(VARIANTS);
  const i = keys.indexOf(variant());
  setVariant(keys[(i + delta + keys.length) % keys.length]);
}

/* ---------- boot ---------- */

document.getElementById("prevBtn").addEventListener("click", () => cycle(-1));
document.getElementById("nextBtn").addEventListener("click", () => cycle(1));
document.getElementById("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
});
document.getElementById("resetBtn").addEventListener("click", resetProjects);

document.addEventListener("keydown", e => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") cycle(-1);
  else if (e.key === "ArrowRight") cycle(1);
});

const initialVariant = new URLSearchParams(location.search).get("variant");
if (!initialVariant || !(initialVariant.toUpperCase() in VARIANTS)) {
  setVariant("C");
}
render();
</script>
</body>
</html>
