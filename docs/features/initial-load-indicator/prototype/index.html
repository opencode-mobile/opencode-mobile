<!doctype html>
<!--
  PROTOTYPE — Initial load indicator (Home + Session). Pass 4.

  Question: What should the initial-load progress indicator look like —
  clean, not disturbing, and without accent colors?

  Pass 4: each variant authored by a different model subagent.
  A — Hush Field Lift        (cursor-grok-4.5-high)
  B — System Datum           (gpt-5.6-sol-medium)
  C — Late Upper Caption     (composer-2.5-fast)

  Variants via ?variant=A|B|C (or floating bar / arrow keys).
  Throwaway. Not for production.
-->
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PROTOTYPE — Initial load indicator (pass 4)</title>
    <style>
      :root {
        --page-bg: #e9e9ef;
        --phone-bg: #f8f8f8;
        --surface: #f8f8f8;
        --surface-raised: #f3f3f3;
        --text-strong: #171717;
        --text-base: #6f6f6f;
        --text-weak: #8f8f8f;
        --text-weaker: #c7c7c7;
        --border: #dddddd;
        --border-weak: #e8e8e8;
        --border-weaker: #f0f0f0;
        --icon: #8f8f8f;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --phone-w: 320px;
        --phone-h: 640px;
      }

      html[data-theme="dark"] {
        --page-bg: #101010;
        --phone-bg: #1c1c1c;
        --surface: #1c1c1c;
        --surface-raised: #232323;
        --text-strong: #ededed;
        --text-base: #a0a0a0;
        --text-weak: #707070;
        --text-weaker: #505050;
        --border: #2e2e2e;
        --border-weak: #282828;
        --border-weaker: #232323;
        --icon: #7e7e7e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font);
        background: var(--page-bg);
        color: var(--text-strong);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 72px 16px 120px;
        gap: 18px;
      }

      .page-meta {
        text-align: center;
        max-width: 720px;
        font-size: 13px;
        line-height: 1.45;
        color: var(--text-base);
      }
      .page-meta strong {
        display: block;
        color: var(--text-strong);
        font-size: 15px;
        margin-bottom: 4px;
      }
      .page-meta code {
        font-size: 12px;
        background: rgba(127, 127, 127, 0.12);
        padding: 1px 5px;
        border-radius: 4px;
      }

      .stage {
        display: flex;
        flex-wrap: wrap;
        gap: 28px;
        justify-content: center;
        align-items: flex-start;
      }

      .phone-wrap {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }
      .phone-label {
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-weak);
        font-weight: 600;
      }

      .phone {
        width: var(--phone-w);
        height: var(--phone-h);
        background: var(--phone-bg);
        border: 1px solid var(--border);
        border-radius: 28px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      }

      .status-fake {
        height: 28px;
        padding: 10px 18px 0;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-strong);
        flex-shrink: 0;
      }

      .topbar {
        height: 48px;
        padding: 0 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        border-bottom: 1px solid var(--border-weaker);
        position: relative;
        z-index: 2;
        background: var(--phone-bg);
      }
      .topbar .title {
        font-size: 16px;
        font-weight: 650;
      }
      .topbar .actions {
        display: flex;
        gap: 8px;
      }
      .topbar .dot {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--surface-raised);
      }

      .session-sub {
        font-size: 11px;
        color: var(--text-weak);
        font-weight: 500;
        margin-top: 1px;
      }
      .topbar-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .back-chev {
        width: 10px;
        height: 10px;
        border-left: 2px solid var(--text-strong);
        border-bottom: 2px solid var(--text-strong);
        transform: rotate(45deg);
        margin-left: 4px;
      }

      .content {
        flex: 1;
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .composer-fake,
      .home-dock-fake {
        position: relative;
        z-index: 2;
      }

      .composer-fake {
        height: 56px;
        margin: 10px 12px 16px;
        border-radius: 16px;
        background: var(--surface-raised);
        border: 1px solid var(--border-weak);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        padding: 0 14px;
        color: var(--text-weaker);
        font-size: 13px;
      }

      .home-dock-fake {
        height: 52px;
        margin: 8px 12px 18px;
        border-radius: 18px;
        background: var(--surface-raised);
        border: 1px solid var(--border-weak);
        flex-shrink: 0;
        opacity: 0.55;
      }

      /* ========== A — Hush Field Lift ========== */
      .hush-wrap {
        flex: 1;
        position: relative;
        min-height: 0;
        overflow: hidden;
      }
      .hush-field {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 90% 70% at 50% 42%,
          var(--text-strong) 0%,
          transparent 70%
        );
        opacity: 0.03;
        animation: hushLift 1.8s ease-in-out infinite;
        pointer-events: none;
      }
      html[data-theme="dark"] .hush-field {
        opacity: 0.05;
        animation-name: hushLiftDark;
      }

      /* ========== B — System Datum ========== */
      .datum-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .datum-line {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 14px 16px 0;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--text-weak);
        text-transform: uppercase;
        flex-shrink: 0;
      }
      .datum-dots {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .datum-dots span {
        width: 4px;
        height: 4px;
        border-radius: 1px;
        background: var(--text-weaker);
        opacity: 0.25;
        animation: datumDot 1.8s linear infinite;
      }
      .datum-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .datum-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      .datum-rest {
        flex: 1;
      }

      /* ========== C — Late Upper Caption ========== */
      .late-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 28px 16px 0;
      }
      .late-caption {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-base);
        opacity: 0;
        align-self: flex-start;
        animation: lateAppear 3.2s ease-in-out infinite;
      }
      .late-rest {
        flex: 1;
      }

      @keyframes hushLift {
        0%,
        100% {
          opacity: 0.02;
          transform: scale(0.98);
        }
        50% {
          opacity: 0.055;
          transform: scale(1);
        }
      }
      @keyframes hushLiftDark {
        0%,
        100% {
          opacity: 0.035;
          transform: scale(0.98);
        }
        50% {
          opacity: 0.09;
          transform: scale(1);
        }
      }
      @keyframes datumDot {
        0%,
        100% {
          opacity: 0.2;
        }
        20%,
        40% {
          opacity: 1;
        }
        55% {
          opacity: 0.25;
        }
      }
      @keyframes lateAppear {
        0%,
        17% {
          opacity: 0;
        }
        /* 550ms / 3200ms ≈ 17% blank hold */
        30% {
          opacity: 0.55;
        }
        /* fade in ~400ms */
        55% {
          opacity: 0.55;
        }
        70% {
          opacity: 0.45;
        }
        85% {
          opacity: 0.55;
        }
        100% {
          opacity: 0.5;
        }
      }

      .state-line {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-weak);
        max-width: 780px;
        text-align: center;
        word-break: break-word;
      }

      .model-chip {
        font-size: 11px;
        color: var(--text-weaker);
        text-align: center;
        max-width: 640px;
      }
      .model-chip span {
        color: var(--text-base);
      }

      .switcher {
        position: fixed;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        background: #111;
        color: #f5f5f5;
        border-radius: 999px;
        box-shadow: 0 10px 36px rgba(0, 0, 0, 0.35);
        z-index: 50;
        font-size: 13px;
        user-select: none;
      }
      .switcher button {
        appearance: none;
        border: 0;
        background: #2a2a2a;
        color: #f5f5f5;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
      }
      .switcher button:hover {
        background: #3a3a3a;
      }
      .switcher .label {
        min-width: 200px;
        text-align: center;
        font-weight: 600;
      }
      .switcher .tools {
        display: flex;
        gap: 6px;
        margin-left: 4px;
        padding-left: 8px;
        border-left: 1px solid #333;
      }
      .switcher .tools button {
        width: auto;
        padding: 0 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
      }

      .tag {
        position: fixed;
        top: 14px;
        right: 14px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #f5f5f5;
        background: #111;
        padding: 6px 10px;
        border-radius: 999px;
        z-index: 50;
      }
    </style>
  </head>
  <body>
    <div class="tag" id="variantTag">PROTOTYPE · A</div>

    <div class="page-meta">
      <strong>PROTOTYPE — Initial load indicator · pass 4</strong>
      One concept per model. No accents.
      Variants: <code>?variant=A|B|C</code>
    </div>

    <div class="model-chip" id="modelChip"></div>
    <div class="stage" id="stage"></div>
    <div class="state-line" id="stateLine"></div>

    <div class="switcher" role="toolbar" aria-label="Prototype variant switcher">
      <button type="button" id="prevBtn" aria-label="Previous variant">←</button>
      <div class="label" id="variantLabel">A — Hush Field Lift</div>
      <button type="button" id="nextBtn" aria-label="Next variant">→</button>
      <div class="tools">
        <button type="button" id="themeBtn">Theme</button>
      </div>
    </div>

    <script>
      const VARIANTS = {
        A: {
          name: "Hush Field Lift",
          model: "cursor-grok-4.5-high",
          agent: "f59810b9-29cf-44c9-9fdf-1f86523cfd41",
          brief: "Presence without chrome",
          note: "Content plane softly wakes — no mark, track, or type.",
        },
        B: {
          name: "System Datum",
          model: "gpt-5.6-sol-medium",
          agent: "79d683cf-3cca-4ef5-a208-210b0e5843bd",
          brief: "Tool status, not marketing",
          note: "Monospace instrument line under top bar; sequential dots.",
          homeLabel: "READING SESSIONS",
          sessionLabel: "READING MESSAGES",
        },
        C: {
          name: "Late Upper Caption",
          model: "composer-2.5-fast",
          agent: "ed83f24a-9b4e-41a8-8e52-5f333e184f01",
          brief: "Almost nothing, then just enough",
          note: "550ms blank hold, then left-aligned upper-third caption.",
          homeLabel: "Loading sessions",
          sessionLabel: "Loading messages",
        },
      };

      function variantKey() {
        const raw = (new URLSearchParams(location.search).get("variant") || "A").toUpperCase();
        return raw in VARIANTS ? raw : "A";
      }

      function setVariant(key) {
        const url = new URL(location.href);
        url.searchParams.set("variant", key);
        history.replaceState({}, "", url);
        render();
      }

      function cycle(delta) {
        const keys = Object.keys(VARIANTS);
        const i = keys.indexOf(variantKey());
        setVariant(keys[(i + delta + keys.length) % keys.length]);
      }

      function statusBar() {
        return `<div class="status-fake"><span>9:41</span><span>●●●</span></div>`;
      }

      function topBarHome() {
        return `
          <div class="topbar">
            <div class="title">Sessions</div>
            <div class="actions"><div class="dot"></div></div>
          </div>`;
      }

      function topBarSession() {
        return `
          <div class="topbar">
            <div class="topbar-left">
              <div class="back-chev" aria-hidden="true"></div>
              <div>
                <div class="title">Fix auth race</div>
                <div class="session-sub">opencode-mobile</div>
              </div>
            </div>
            <div class="actions"><div class="dot"></div></div>
          </div>`;
      }

      function indicatorMarkup(key, kind) {
        const v = VARIANTS[key];
        const isHome = kind === "home";

        if (key === "A") {
          return `
            <div class="hush-wrap" aria-label="Loading">
              <div class="hush-field"></div>
            </div>`;
        }

        if (key === "B") {
          const label = isHome ? v.homeLabel : v.sessionLabel;
          return `
            <div class="datum-wrap" aria-label="Loading">
              <div class="datum-line">
                <span>${label}</span>
                <span class="datum-dots" aria-hidden="true">
                  <span></span><span></span><span></span>
                </span>
              </div>
              <div class="datum-rest"></div>
            </div>`;
        }

        const label = isHome ? v.homeLabel : v.sessionLabel;
        return `
          <div class="late-wrap" aria-label="Loading">
            <div class="late-caption">${label}</div>
            <div class="late-rest"></div>
          </div>`;
      }

      function phone(kind, key) {
        const isHome = kind === "home";
        const footer = isHome
          ? `<div class="home-dock-fake" aria-hidden="true"></div>`
          : `<div class="composer-fake">Message…</div>`;
        return `
          <div class="phone-wrap">
            <div class="phone-label">${isHome ? "Home" : "Session"}</div>
            <div class="phone">
              ${statusBar()}
              ${isHome ? topBarHome() : topBarSession()}
              <div class="content">
                ${indicatorMarkup(key, kind)}
                ${footer}
              </div>
            </div>
          </div>`;
      }

      function render() {
        const key = variantKey();
        const v = VARIANTS[key];
        document.getElementById("variantTag").textContent = "PROTOTYPE · " + key;
        document.getElementById("variantLabel").textContent = key + " — " + v.name;
        document.getElementById("modelChip").innerHTML =
          "Authored by <span>" +
          v.model +
          "</span> · brief: “" +
          v.brief +
          "”";
        document.getElementById("stage").innerHTML =
          phone("home", key) + phone("session", key);
        document.getElementById("stateLine").textContent =
          "state { pass: 4 · variant: " +
          key +
          " · " +
          v.name +
          " · model: " +
          v.model +
          " · screens: [home, session] · accent: none · " +
          v.note +
          " }";
      }

      document.getElementById("prevBtn").addEventListener("click", () => cycle(-1));
      document.getElementById("nextBtn").addEventListener("click", () => cycle(1));
      document.getElementById("themeBtn").addEventListener("click", () => {
        const cur = document.documentElement.getAttribute("data-theme");
        document.documentElement.setAttribute(
          "data-theme",
          cur === "dark" ? "light" : "dark",
        );
      });
      document.addEventListener("keydown", (e) => {
        const t = e.target;
        if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable))
          return;
        if (e.key === "ArrowLeft") cycle(-1);
        else if (e.key === "ArrowRight") cycle(1);
      });

      render();
    </script>
  </body>
</html>
