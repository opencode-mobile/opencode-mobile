<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit server — Test placement (from B)</title>
<style>
  :root {
    --bg: #1C1C1C;
    --field: #2A2A2A;
    --text: #EDEDED;
    --text-base: #A0A0A0;
    --text-weak: #707070;
    --border: #282828;
    --success: #3DDC84;
    --error: #F07178;
    --interactive: #8CB0FF;
    --phone-w: 390px;
    --phone-h: 844px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: #0e0e0e; color: var(--text); padding: 28px 20px 140px;
  }
  .page-meta { max-width: 920px; margin: 0 auto 20px; }
  .page-meta h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.02em; }
  .page-meta p { margin: 0 0 8px; color: var(--text-base); font-size: 0.95rem; line-height: 1.5; max-width: 44rem; }
  .note {
    margin-top: 12px; padding: 12px 14px; border: 1px dashed #3a3a3a; border-radius: 12px;
    background: #151515; max-width: 44rem; font-size: 13px; line-height: 1.45; color: var(--text-base);
  }
  .stage { display: flex; justify-content: center; }
  .phone {
    width: var(--phone-w); height: var(--phone-h); background: var(--bg);
    border-radius: 44px; border: 1px solid #333;
    box-shadow: 0 0 0 1px #111, 0 24px 80px rgba(0,0,0,0.55);
    overflow: hidden; position: relative; flex-shrink: 0;
  }
  .notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 30;
  }
  .status-bar {
    height: 54px; padding: 18px 28px 0; display: flex; justify-content: space-between;
    font-size: 14px; font-weight: 600;
  }
  .app { height: calc(100% - 54px); display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px 10px 8px; min-height: 56px; border-bottom: 1px solid var(--border);
  }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.08);
    border: none; color: var(--text); display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .title { flex: 1; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
  .top-test {
    border: none; background: none; color: var(--interactive); font: inherit;
    font-size: 16px; font-weight: 600; cursor: pointer; padding: 8px 6px;
  }
  .scroll { flex: 1; overflow: auto; padding: 16px 20px 24px; }
  .field {
    background: var(--field); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
    font-size: 16px; color: var(--text);
  }
  .field.dim { color: var(--text-weak); }
  .host-row { display: flex; align-items: center; gap: 10px; }
  .scheme { color: var(--text-base); font-size: 15px; flex-shrink: 0; }
  .host { flex: 1; min-width: 0; }
  .status-row {
    display: flex; align-items: center; justify-content: space-between;
    margin: -4px 4px 16px;
  }
  .status-row .msg { font-size: 13px; color: var(--text-base); }
  .status-row .msg.ok { color: var(--success); }
  .link {
    border: none; background: none; color: var(--interactive); font: inherit;
    font-size: 15px; font-weight: 500; padding: 0; cursor: pointer;
  }
  .hint { font-size: 13px; color: var(--text-base); margin: 4px 0 16px; min-height: 18px; }
  .hint.ok { color: var(--success); }
  .foot { padding: 12px 20px 28px; }
  .cta {
    width: 100%; height: 48px; border: none; border-radius: 12px;
    background: #EDEDED; color: #111; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .cta:disabled { opacity: 0.35; cursor: default; }
  .dialog {
    position: absolute; left: 28px; right: 28px; top: 38%;
    background: #2A2A2A; border-radius: 16px; padding: 20px 18px 16px; z-index: 40;
  }
  .dialog h3 { margin: 0 0 8px; font-size: 17px; }
  .dialog p { margin: 0 0 16px; font-size: 14px; color: var(--text-base); line-height: 1.4; }
  .dialog-row { display: flex; gap: 8px; justify-content: flex-end; }
  .dialog-row button {
    border: none; background: none; font: inherit; font-size: 16px; font-weight: 600;
    cursor: pointer; padding: 8px 10px;
  }
  .dialog-row .cancel { color: var(--text-base); }
  .dialog-row .go { color: var(--error); }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 35; }
  .state {
    max-width: 920px; margin: 20px auto 0; font-family: ui-monospace, Menlo, monospace;
    font-size: 12px; color: var(--text-base); white-space: pre-wrap;
  }
  .switcher {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    background: #ededed; color: #111; border-radius: 999px;
    padding: 8px 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.45); z-index: 50;
  }
  .switcher button {
    width: 36px; height: 36px; border: none; border-radius: 50%;
    background: #111; color: #fff; font-size: 16px; cursor: pointer;
  }
  .switcher .lab { font-size: 13px; font-weight: 600; min-width: 240px; text-align: center; }
</style>
</head>
<body>
<div class="page-meta">
  <h1>Edit server — Test off the host row</h1>
  <p>Same B chrome: trash in the top bar, one Save at the bottom. Only Test moves. Throwaway.</p>
  <div class="note">Question: if Test is not inside the host field, where should it sit?</div>
</div>
<div class="stage"><div class="phone" id="phone"></div></div>
<pre class="state" id="state"></pre>
<div class="switcher">
  <button type="button" id="prev">←</button>
  <div class="lab" id="lab"></div>
  <button type="button" id="next">→</button>
</div>
<script>
const VARIANTS = [
  { key: "A", name: "Link under fields" },
  { key: "B", name: "Status row under host" },
  { key: "C", name: "Test in the top bar" },
];

const state = {
  variant: new URLSearchParams(location.search).get("variant") || "A",
  name: "Mac Mini V1",
  host: "100.110.204.22:4096",
  tested: false,
  dialog: false,
  last: "opened",
};

function setVariant(key) {
  state.variant = key;
  const url = new URL(location.href);
  url.searchParams.set("variant", key);
  history.replaceState(null, "", url);
  render();
}

function cycle(dir) {
  const i = VARIANTS.findIndex((v) => v.key === state.variant);
  setVariant(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key);
}

function backSvg() {
  return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>`;
}
function trashSvg() {
  return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;
}

function fields() {
  return `
    <div class="field">${state.name}</div>
    <div class="field host-row">
      <span class="scheme">http ▾</span>
      <span class="host">${state.host}</span>
    </div>`;
}

function restFields() {
  return `
    <div class="field">opencode</div>
    <div class="field dim">Password</div>`;
}

function chrome(extraTop) {
  return `
    <div class="topbar">
      <button class="icon-btn" data-act="back">${backSvg()}</button>
      <div class="title">Edit server</div>
      ${extraTop || ""}
      <button class="icon-btn" data-act="confirm" aria-label="Remove">${trashSvg()}</button>
    </div>`;
}

function saveFoot() {
  return `<div class="foot"><button class="cta" data-act="save" ${state.tested ? "" : "disabled"}>Save</button></div>`;
}

function dialog() {
  if (!state.dialog) return "";
  return `
    <div class="scrim" data-act="close"></div>
    <div class="dialog">
      <h3>Remove “${state.name}”?</h3>
      <p>This device forgets the Connection Profile. Sessions stay on that server.</p>
      <div class="dialog-row">
        <button class="cancel" data-act="close">Cancel</button>
        <button class="go" data-act="removed">Remove</button>
      </div>
    </div>`;
}

function variantA() {
  const hint = state.tested
    ? `<div class="hint ok">Server reachable</div>`
    : `<div class="hint">Rename can Save now. Host or password changes need Test.</div>`;
  return `
    ${chrome()}
    <div class="scroll">
      ${fields()}${restFields()}
      ${hint}
      <button class="link" data-act="test">${state.tested ? "Test again" : "Test connection"}</button>
    </div>
    ${saveFoot()}`;
}

function variantB() {
  const row = state.tested
    ? `<div class="status-row"><span class="msg ok">Server reachable</span><button class="link" data-act="test">Test again</button></div>`
    : `<div class="status-row"><span class="msg">Not tested yet</span><button class="link" data-act="test">Test connection</button></div>`;
  return `
    ${chrome()}
    <div class="scroll">
      ${fields()}
      ${row}
      ${restFields()}
    </div>
    ${saveFoot()}`;
}

function variantC() {
  const hint = state.tested
    ? `<div class="hint ok">Server reachable</div>`
    : `<div class="hint">Rename can Save now. Host or password changes need Test.</div>`;
  return `
    ${chrome(`<button class="top-test" data-act="test">${state.tested ? "Retest" : "Test"}</button>`)}
    <div class="scroll">${fields()}${restFields()}${hint}</div>
    ${saveFoot()}`;
}

function render() {
  const v = VARIANTS.find((x) => x.key === state.variant) || VARIANTS[0];
  const body = v.key === "A" ? variantA() : v.key === "B" ? variantB() : variantC();
  document.getElementById("phone").innerHTML =
    `<div class="notch"></div><div class="status-bar"><span>9:41</span><span>••••</span></div><div class="app">${body}${dialog()}</div>`;
  document.getElementById("lab").textContent = `${v.key} — ${v.name}`;
  document.getElementById("state").textContent =
    `locked=B chrome (trash + one Save)\nvariant=${v.key} (${v.name})\ntested=${state.tested}\ndialog=${state.dialog}\nlast=${state.last}`;
}

document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
document.getElementById("phone").addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (!act) return;
  if (act === "test") { state.tested = true; state.last = "tested"; }
  if (act === "save") { state.last = "saved"; }
  if (act === "confirm") { state.dialog = true; state.last = "confirm-remove"; }
  if (act === "close") { state.dialog = false; state.last = "dialog-closed"; }
  if (act === "removed") { state.dialog = false; state.last = "removed"; }
  if (act === "back") { state.last = "back"; }
  render();
});

if (!VARIANTS.some((v) => v.key === state.variant)) state.variant = "A";
render();
</script>
</body>
</html>
