<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session List dock — current vs scope picker</title>
<!--
  PROTOTYPE (throwaway): How should the home dock handle 4+ projects?
  Two versions side by side, shared selection / project count.
  A — Current (horizontal chip scroller)
  B — Scope picker sheet
-->
<style>
  :root {
    --bg: #1C1C1C;
    --raised: #232323;
    --raised-hover: #2A2A2A;
    --text: #EDEDED;
    --text-base: #A0A0A0;
    --text-weak: #707070;
    --text-weaker: #505050;
    --border: #282828;
    --success: #3DDC84;
    --interactive: #8CB0FF;
    --error: #F07178;
    --phone-w: 390px;
    --phone-h: 844px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: #0e0e0e;
    color: var(--text);
    padding: 16px 20px 48px;
  }

  .page-meta { max-width: 860px; margin: 0 auto 12px; text-align: center; }
  .page-meta h1 {
    font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.02em;
  }
  .page-meta p {
    margin: 0 auto 4px; color: var(--text-base); font-size: 0.88rem; line-height: 1.4; max-width: 42rem;
  }
  .page-meta .tag {
    display: inline-block; margin-top: 8px; font-size: 11px; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--text-weak); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 10px;
  }

  .controls {
    max-width: 860px; margin: 0 auto 16px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
  }
  .controls label {
    font-size: 12px; color: var(--text-weak); text-transform: uppercase;
    letter-spacing: 0.04em; margin-right: 4px;
  }
  .chip-btn {
    font-size: 13px; font-weight: 500; color: var(--text-base);
    background: #1a1a1a; border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 12px; cursor: pointer;
  }
  .chip-btn:hover { border-color: #444; color: var(--text); }
  .chip-btn.on {
    background: rgba(140,176,255,0.14); border-color: rgba(140,176,255,0.35); color: #c5d6ff;
  }

  .stage {
    display: flex; justify-content: center; align-items: flex-start;
    gap: 28px; flex-wrap: wrap;
  }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .col-label {
    font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--text-weak);
  }
  .phone-frame { width: var(--phone-w); }

  @media (max-width: 900px) {
    .phone-frame {
      transform: scale(0.78);
      transform-origin: top center;
      height: calc(var(--phone-h) * 0.78);
    }
  }

  .phone {
    width: var(--phone-w); height: var(--phone-h); background: var(--bg);
    border-radius: 44px; border: 1px solid #333;
    box-shadow: 0 0 0 1px #111, 0 24px 80px rgba(0,0,0,0.55);
    overflow: hidden; position: relative; flex-shrink: 0;
  }
  .phone-notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 34px; background: #000; border-radius: 20px;
    z-index: 30; pointer-events: none;
  }
  .status-bar {
    height: 54px; padding: 18px 28px 0; display: flex; justify-content: space-between;
    align-items: center; font-size: 14px; font-weight: 600; position: relative; z-index: 5;
  }
  .status-bar .right { font-size: 12px; opacity: 0.9; }
  .app {
    height: calc(100% - 54px); display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }

  .topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px 10px 8px; min-height: 56px; flex-shrink: 0;
  }
  .title-block { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; height: 40px; }
  .title { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
  .subtitle-row { display: flex; align-items: center; gap: 6px; }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex-shrink: 0;
    box-shadow: 0 0 0 2px rgba(61, 220, 132, 0.18);
  }
  .status-label { font-size: 12px; color: var(--text-base); text-transform: lowercase; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.08);
    border: none; color: var(--text); display: grid; place-items: center; flex-shrink: 0; cursor: pointer;
  }
  .icon-btn svg { width: 18px; height: 18px; }

  .scroll { flex: 1; overflow: auto; padding: 0 0 168px; -webkit-overflow-scrolling: touch; }
  .section-h {
    padding: 8px 16px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
    color: var(--text-base); text-transform: uppercase;
  }
  .section-h.later { padding-top: 16px; }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    width: 100%; border: none; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .row:active { background: var(--raised); }
  .row-body { flex: 1; min-width: 0; }
  .row-title {
    font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-sub {
    font-size: 13px; color: var(--text-base); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .row-time { font-size: 12px; color: var(--text-weak); }
  .pill { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 8px; line-height: 1.4; }
  .pill.idle { background: rgba(237,237,237,0.10); color: var(--text-base); }
  .pill.running { background: rgba(140,176,255,0.16); color: var(--interactive); }
  .pill.ready { background: rgba(61,220,132,0.16); color: var(--success); }
  .row-div { height: 1px; background: #232323; margin-left: 60px; }

  .letter {
    width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
    font-size: 14px; font-weight: 700; flex-shrink: 0; position: relative;
  }
  .letter .corner-dot {
    position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px;
    border-radius: 50%; border: 2px solid var(--bg);
  }
  .letter .corner-dot.running { background: var(--interactive); }
  .letter .corner-dot.ready { background: var(--success); }
  .letter .corner-dot.idle { background: var(--text-weak); }
  .letter.sm { width: 22px; height: 22px; font-size: 11px; }

  .fade {
    position: absolute; left: 0; right: 0; bottom: 0; height: 168px; z-index: 6; pointer-events: none;
    background: linear-gradient(to top, rgba(28,28,28,0.96) 0%, rgba(28,28,28,0.55) 42%, rgba(28,28,28,0) 100%);
  }

  .dock-wrap {
    position: absolute; left: 16px; right: 16px; bottom: 12px; z-index: 8;
  }
  .dock {
    background: rgba(35,35,35,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border); border-radius: 26px; padding: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
  }
  .dock-stack { display: flex; flex-direction: column; gap: 10px; }
  .chips {
    display: flex; gap: 8px; align-items: center; overflow-x: auto; flex-wrap: nowrap;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; border: none; cursor: pointer; font: inherit; font-size: 13px; font-weight: 500;
    color: var(--text); background: rgba(237,237,237,0.08); border-radius: 999px;
    padding: 8px 12px; min-height: 36px; display: inline-flex; align-items: center; gap: 6px;
  }
  .chip.sel { background: rgba(237,237,237,0.14); }
  .chip.more { background: rgba(140,176,255,0.12); color: #c5d6ff; }
  .chip .n {
    font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
    background: rgba(237,237,237,0.10); border-radius: 999px; padding: 1px 6px; min-width: 20px; text-align: center;
  }
  .chip .x {
    width: 20px; height: 20px; border-radius: 50%; background: rgba(237,237,237,0.10);
    display: grid; place-items: center; margin-left: -2px; margin-right: -6px;
  }
  .chip .x svg { width: 12px; height: 12px; }

  .dock-actions { display: flex; gap: 8px; align-items: center; }
  .add-circle {
    width: 52px; height: 52px; border-radius: 50%; border: none;
    background: rgba(237,237,237,0.14); color: var(--text);
    display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
  }
  .add-circle svg { width: 22px; height: 22px; }
  .new-session {
    flex: 1; height: 52px; border: none; border-radius: 999px;
    background: rgba(237,237,237,0.14); color: var(--text);
    font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }

  /* Variant B — single scope control */
  .scope {
    width: 100%; border: none; cursor: pointer; font: inherit; text-align: left;
    background: rgba(237,237,237,0.08); border-radius: 14px; padding: 8px 10px;
    display: flex; align-items: center; gap: 10px; min-height: 44px; color: inherit;
  }
  .scope:active { background: rgba(237,237,237,0.12); }
  .scope-body { flex: 1; min-width: 0; }
  .scope-title {
    font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .scope-sub { font-size: 11px; color: var(--text-weak); margin-top: 1px; }
  .scope-count {
    font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
    background: rgba(237,237,237,0.10); border-radius: 999px; padding: 2px 8px; color: var(--text);
    flex-shrink: 0;
  }
  .scope-chev { color: var(--text-weak); flex-shrink: 0; display: grid; place-items: center; }
  .scope-chev svg { width: 16px; height: 16px; }
  .scope-all-mark {
    width: 32px; height: 32px; border-radius: 50%; background: rgba(237,237,237,0.10);
    display: grid; place-items: center; flex-shrink: 0; color: var(--text);
  }
  .scope-all-mark svg { width: 16px; height: 16px; }

  /* Variant C — letter rail */
  .rail { display: flex; align-items: center; gap: 6px; overflow: hidden; }
  .rail-scroll {
    display: flex; align-items: center; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1;
  }
  .rail-scroll::-webkit-scrollbar { display: none; }
  .token {
    flex-shrink: 0; border: none; cursor: pointer; padding: 0;
    width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
    background: rgba(237,237,237,0.08); color: var(--text);
  }
  .token.all { font-size: 10px; font-weight: 700; letter-spacing: 0; }
  .token.sel-all { background: rgba(237,237,237,0.18); }
  .token-chip {
    flex-shrink: 0; border: none; cursor: pointer; font: inherit;
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 32px; border-radius: 999px; padding: 0 8px 0 2px;
    color: var(--text);
  }
  .token-chip .name { font-size: 13px; font-weight: 600; max-width: 118px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .token-chip .n {
    font-size: 11px; font-weight: 600; background: rgba(0,0,0,0.22); border-radius: 999px; padding: 1px 6px;
  }
  .token-chip .x {
    width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,0.22);
    display: grid; place-items: center;
  }
  .token-chip .x svg { width: 10px; height: 10px; }

  .home-ind {
    position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
    width: 128px; height: 5px; border-radius: 999px; background: #3a3a3a; z-index: 9; pointer-events: none;
  }

  /* Popover (A) */
  .popover {
    position: absolute; right: 12px; bottom: 148px; z-index: 22;
    min-width: 220px; max-width: 280px; max-height: 320px; overflow: auto;
    background: #2A2A2A; border: 1px solid #333; border-radius: 14px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.5);
  }
  .popover-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    width: 100%; border: none; background: none; color: inherit; font: inherit;
    text-align: left; cursor: pointer;
  }
  .popover-row + .popover-row { border-top: 1px solid var(--border); }
  .popover-row:active { background: var(--raised-hover); }
  .popover-row .grow { flex: 1; min-width: 0; }
  .popover-row .nm { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .popover-row .ct { font-size: 12px; color: var(--text-weak); font-variant-numeric: tabular-nums; }

  /* Sheet (B) */
  .overlay {
    position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,0.45);
  }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; top: 88px; z-index: 21;
    background: var(--bg); border-radius: 20px 20px 0 0;
    display: flex; flex-direction: column; box-shadow: 0 -12px 40px rgba(0,0,0,0.45);
  }
  .sheet-handle {
    width: 36px; height: 5px; border-radius: 999px; background: #3a3a3a; margin: 10px auto 4px;
  }
  .sheet-title {
    text-align: center; font-size: 16px; font-weight: 600; padding: 4px 16px 10px;
  }
  .search {
    margin: 0 16px 8px; display: flex; align-items: center; gap: 8px;
    background: var(--raised); border-radius: 12px; padding: 8px 12px;
  }
  .search svg { width: 16px; height: 16px; color: var(--text-weak); flex-shrink: 0; }
  .search input {
    flex: 1; background: none; border: none; outline: none; color: var(--text);
    font: inherit; font-size: 15px; min-width: 0;
  }
  .search input::placeholder { color: var(--text-weak); }
  .sheet-list { flex: 1; overflow: auto; padding-bottom: 20px; }
  .sheet-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    width: 100%; border: none; background: none; color: inherit; font: inherit;
    text-align: left; cursor: pointer; border-radius: 14px;
    transform-origin: center; transition: transform 0.16s cubic-bezier(0.2, 0.8, 0.2, 1);
    -webkit-user-select: none; user-select: none; touch-action: pan-y;
  }
  .sheet-row:active { background: var(--raised); }
  .sheet-row.pressing {
    background: var(--raised);
    transform: scale(0.965);
  }
  .sheet-row.popping {
    background: var(--raised);
    animation: row-pop 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @keyframes row-pop {
    0% { transform: scale(0.965); }
    42% { transform: scale(1.035); }
    100% { transform: scale(1); }
  }
  .sheet-row .grow { flex: 1; min-width: 0; }
  .sheet-row .nm { font-size: 16px; font-weight: 600; }
  .sheet-row .path { font-size: 12px; color: var(--text-weak); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .dlg-scrim {
    position: absolute; inset: 0; z-index: 32;
    background: rgba(0,0,0,0.45);
    display: grid; place-items: center; padding: 24px;
  }
  .dlg {
    width: 100%; max-width: 320px;
    background: var(--bg);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
  }
  .dlg-title { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
  .dlg-sub { font-size: 14px; color: var(--text-base); margin-top: 8px; line-height: 1.4; }
  .dlg-actions { display: flex; gap: 8px; margin-top: 16px; }
  .dlg-btn {
    flex: 1; height: 44px; border: none; border-radius: 12px; cursor: pointer;
    font: inherit; font-size: 15px; font-weight: 600; color: var(--text);
  }
  .dlg-btn.low { background: rgba(237,237,237,0.08); }
  .dlg-btn.dest { background: rgba(240,113,120,0.16); color: var(--error); }

  .snack {
    position: absolute; left: 24px; right: 24px; bottom: 156px; z-index: 24;
    background: #2E2E2E; border-radius: 12px; padding: 12px 14px; font-size: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); pointer-events: none;
    opacity: 0; transform: translateY(8px); transition: opacity 0.2s, transform 0.2s;
  }
  .snack.on { opacity: 1; transform: translateY(0); }

  .state-dump {
    max-width: 860px; margin: 24px auto 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; color: var(--text-weak); background: #151515;
    border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; white-space: pre-wrap;
  }

  .switcher {
    position: fixed; bottom: 24px; left: 24px; z-index: 100;
    display: flex; align-items: center; gap: 4px; background: #f5f5f5; color: #111;
    border-radius: 999px; padding: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.08);
    font-size: 13px; font-weight: 600; max-width: calc(100vw - 24px);
  }
  .switcher button {
    width: 36px; height: 36px; border-radius: 50%; border: none; background: #e8e8e8;
    color: #111; cursor: pointer; font-size: 16px; display: grid; place-items: center; flex-shrink: 0;
  }
  .switcher button:hover { background: #ddd; }
  .switcher .label {
    padding: 0 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: min(360px, 64vw); text-align: center;
  }
  .switcher .label small {
    display: block; font-weight: 500; font-size: 11px; color: #666; margin-top: 1px;
  }

  @media (max-width: 480px) {
    body { padding: 16px 12px 32px; }
    .page-meta { padding: 0; }
    .controls { padding: 0; }
    .state-dump { margin: 16px auto 0; }
  }
</style>
</head>
<body>
  <header class="page-meta">
    <h1>Session List dock — 4+ projects</h1>
    <p>
      Side by side on the same data. Filter, add, or remove on either phone — the other follows.
    </p>
    <span class="tag">Prototype · not production · current vs B</span>
  </header>

  <div class="controls" id="controls"></div>
  <div class="stage" id="stage">
    <div class="col">
      <div class="col-label">A — Current</div>
      <div class="phone-frame">
        <div class="phone">
          <div class="phone-notch"></div>
          <div class="status-bar">
            <span>9:41</span>
            <span class="right">●●●● ▮</span>
          </div>
          <div class="app" id="app-a"></div>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="col-label">B — Scope picker</div>
      <div class="phone-frame">
        <div class="phone">
          <div class="phone-notch"></div>
          <div class="status-bar">
            <span>9:41</span>
            <span class="right">●●●● ▮</span>
          </div>
          <div class="app" id="app-b"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="state-dump" id="state"></div>

<script>

  {

  },
  {

    sessions: [
      { title: "Tailscale ACL review", status: "running", caption: "now", section: "recent" },
    ],
  },
  {
    id: "/Users/ivan/Documents/opencode", name: "opencode", letter: "O", accent: "indigo",
    sessions: [
      { title: "Personal agent notes", status: "idle", caption: "Sun", section: "week" },
    ],
  },
];

const ICONS = {
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>',
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-10Z"/><path d="M12 11v6M9 14h6"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 10l4 4 4-4"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12.5 10 17.5 19 7"/></svg>',
  grid: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>',
};

const state = {
  n: 6,
  selectedId: "all",
  sheetOpen: false,
  query: "",
  toast: "",
  lastAction: "load",
  removed: new Set(),
  confirmId: null,
  suppressClick: false,
};

let toastTimer = 0;

function params() {
  let search = location.search;
  try {
    if (window.parent && window.parent !== window) {
      search = window.parent.location.search || search;
    }
  } catch (_) {}
  const u = new URLSearchParams(search);
  return {
    n: Number(u.get("n") || 6),
  };
}

function setParams(next) {
  const write = (href) => {
    const u = new URL(href);
    u.searchParams.set("n", String(next.n));
    u.searchParams.delete("variant");
    return u.pathname + u.search + u.hash;
  };
  history.replaceState(null, "", write(location.href));
  try {
    if (window.parent && window.parent !== window) {
      window.parent.history.replaceState(null, "", write(window.parent.location.href));
    }
  } catch (_) {}
}

function projects() {
  return CATALOG.slice(0, state.n).filter((p) => !state.removed.has(p.id));
}

function projectById(id) {
  return CATALOG.find((p) => p.id === id);
}

function compactPath(id) {
  return id.replace("/Users/ivan", "~");
}

function allSessions() {
  const list = [];
  for (const p of projects()) {
    p.sessions.forEach((s, i) => {
      list.push({
        id: p.id + ":" + i,
        project: p,
        ...s,
      });
    });
  }
  return list;
}

function visibleSessions() {
  const all = allSessions();
  if (state.selectedId === "all") return all;
  return all.filter((s) => s.project.id === state.selectedId);
}

function totalCount() {
  return allSessions().length;
}

function letterEl(p, extra = "") {
  const a = ACCENTS[p.accent];
  return `<span class="letter ${extra}" style="background:${a.fill};color:${a.tint}">${p.letter}</span>`;
}

function showToast(msg, action) {
  state.toast = msg;
  state.lastAction = action;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    state.toast = "";
    render();
  }, 1600);
}

function selectFilter(id) {
  state.selectedId = id;
  state.sheetOpen = false;
  state.query = "";
  state.lastAction = "select:" + (id === "all" ? "all" : projectById(id)?.name);
  render();
}

function removeProject(id, ev) {
  if (ev) ev.stopPropagation();
  const p = projectById(id);
  state.removed.add(id);
  if (state.selectedId === id) state.selectedId = "all";
  state.sheetOpen = false;
  showToast("Removed " + (p?.name || "project"), "remove:" + (p?.name || id));
}

function addProject() {
  if (state.n >= CATALOG.length) {
    showToast("Catalog full — 8 projects", "add:full");
    return;
  }
  state.n += 1;
  setParams({ n: state.n });
  const added = projects()[state.n - 1];
  showToast("Added " + added.name, "add:" + added.name);
}

function newSession() {
  const target = state.selectedId === "all" ? projects()[0] : projectById(state.selectedId);
  if (!target) return;
  target.sessions.unshift({
    title: "New session",
    status: "running",
    caption: "now",
    section: "recent",
  });
  showToast("New session in " + target.name, "new-session:" + target.name);
}

function chipHtml(title, count, selected, onClick, onRemove) {
  const x = onRemove
    ? `<span class="x" data-act="remove" data-id="${onRemove}">${ICONS.close}</span>`
    : "";
  return `<button type="button" class="chip ${selected ? "sel" : ""}" data-act="select" data-id="${onClick}">
    ${title}<span class="n">${count}</span>${x}
  </button>`;
}

function renderList() {
  const sessions = visibleSessions();
  const recent = sessions.filter((s) => s.section === "recent");
  const rest = sessions.filter((s) => s.section !== "recent");
  const block = (items, label, later) => {
    if (!items.length) return "";
    return `<div class="section-h ${later ? "later" : ""}">${label}</div>` +
      items.map((s, i) => {
        const a = ACCENTS[s.project.accent];
        const dot = s.section === "recent"
          ? `<span class="corner-dot ${s.status}"></span>`
          : "";
        return `
          ${i ? '<div class="row-div"></div>' : ""}
          <button type="button" class="row" data-act="open-session" data-id="${s.id}">
            <span class="letter" style="background:${a.fill};color:${a.tint}">
              ${s.project.letter}${dot}
            </span>
            <span class="row-body">
              <div class="row-title">${s.title}</div>
              <div class="row-sub">${compactPath(s.project.id)}</div>
            </span>
            <span class="row-meta">
              <span class="pill ${s.status}">${s.status[0].toUpperCase() + s.status.slice(1)}</span>
              <span class="row-time">${s.caption}</span>
            </span>
          </button>`;
      }).join("");
  };
  if (!sessions.length) {
    return `<div class="section-h">No sessions</div>`;
  }
  return block(recent, "Recent", false) + block(rest, "Earlier", true);
}

function renderDockA() {
  const allSel = state.selectedId === "all";
  let chips = chipHtml("All", totalCount(), allSel, "all");
  for (const p of projects()) {
    const sel = state.selectedId === p.id;
    chips += chipHtml(p.name, p.sessions.length, sel, p.id, sel ? p.id : null);
  }
  return `
    <div class="dock-stack">
      <div class="chips" id="chip-row">${chips}</div>
      ${ctaRow()}
    </div>`;
}

function renderDockB() {
  const p = state.selectedId === "all" ? null : projectById(state.selectedId);
  const mark = p
    ? letterEl(p)
    : `<span class="scope-all-mark">${ICONS.grid}</span>`;
  const title = p ? p.name : "All projects";
  const sub = p ? compactPath(p.id) : projects().length + " projects";
  const count = p ? p.sessions.length : totalCount();
  return `
    <div class="dock-stack">
      <button type="button" class="scope" data-act="open-sheet">
        ${mark}
        <span class="scope-body">
          <div class="scope-title">${title}</div>
          <div class="scope-sub">${sub}</div>
        </span>
        <span class="scope-count">${count}</span>
        <span class="scope-chev">${ICONS.chev}</span>
      </button>
      ${ctaRow()}
    </div>`;
}

function ctaRow() {
  return `<div class="dock-actions">
    <button type="button" class="add-circle" data-act="add" aria-label="Add project">${ICONS.folder}</button>
    <button type="button" class="new-session" data-act="new">New session</button>
  </div>`;
}

function renderDialog() {
  if (!state.confirmId) return "";
  const p = projectById(state.confirmId);
  if (!p) return "";
  return `
    <div class="dlg-scrim" data-act="cancel-remove">
      <div class="dlg" data-act="dlg-card">
        <div class="dlg-title">Remove project</div>
        <div class="dlg-sub">Remove “${p.name}”?</div>
        <div class="dlg-actions">
          <button type="button" class="dlg-btn low" data-act="cancel-remove">Cancel</button>
          <button type="button" class="dlg-btn dest" data-act="confirm-remove">Remove</button>
        </div>
      </div>
    </div>`;
}

function renderSheet() {
  if (!state.sheetOpen) return "";
  const q = state.query.trim().toLowerCase();
  const match = (p) =>
    !q || p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q);
  const allRow = (!q || "all".includes(q) || "projects".includes(q))
    ? `<button type="button" class="sheet-row" data-act="select" data-id="all">
        <span class="scope-all-mark">${ICONS.grid}</span>
        <span class="grow">
          <div class="nm">All projects</div>
          <div class="path">${projects().length} projects</div>
        </span>
        <span class="scope-count">${totalCount()}</span>
      </button>`
    : "";
  const rows = projects().filter(match).map((p) => `
    <button type="button" class="sheet-row" data-act="select" data-id="${p.id}" data-hold="1">
      ${letterEl(p)}
      <span class="grow">
        <div class="nm">${p.name}</div>
        <div class="path">${compactPath(p.id)}</div>
      </span>
      <span class="scope-count">${p.sessions.length}</span>
    </button>`).join("");
  return `
    <div class="overlay" data-act="close-sheet"></div>
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Filter by project</div>
      <div class="search">
        ${ICONS.search}
        <input id="search" type="search" placeholder="Search projects" value="${state.query.replace(/"/g, "&quot;")}">
      </div>
      <div class="sheet-list">${allRow}${rows || '<div class="section-h">No matches</div>'}</div>
    </div>`;
}

function phoneChrome(dockHtml, extraHtml) {
  return `
    <div class="topbar">
      <div class="title-block">
        <div class="title">Sessions</div>
        <div class="subtitle-row">
          <span class="status-dot"></span>
          <span class="status-label">live</span>
        </div>
      </div>
      <button type="button" class="icon-btn" aria-label="Settings">${ICONS.settings}</button>
    </div>
    <div class="scroll">${renderList()}</div>
    <div class="fade"></div>
    <div class="dock-wrap">
      <div class="dock">${dockHtml}</div>
    </div>
    <div class="home-ind"></div>
    ${extraHtml || ""}
    <div class="snack ${state.toast ? "on" : ""}">${state.toast}</div>
  `;
}

function renderApp() {
  document.getElementById("app-a").innerHTML = phoneChrome(renderDockA());
  document.getElementById("app-b").innerHTML = phoneChrome(renderDockB(), renderSheet() + renderDialog());
  const search = document.getElementById("search");
  if (search && !state.confirmId) {
    search.focus();
    search.setSelectionRange(search.value.length, search.value.length);
    search.addEventListener("input", (e) => {
      state.query = e.target.value;
      state.lastAction = "search:" + state.query;
      render();
    });
  }
  bindHoldToDelete();
  const row = document.getElementById("chip-row");
  const sel = row && row.querySelector(".chip.sel");
  if (row && sel) {
    const pad = 8;
    const left = sel.offsetLeft - pad;
    const right = sel.offsetLeft + sel.offsetWidth + pad;
    if (left < row.scrollLeft) row.scrollLeft = left;
    else if (right > row.scrollLeft + row.clientWidth) row.scrollLeft = right - row.clientWidth;
  }
}

function renderControls() {
  document.getElementById("controls").innerHTML = `
    <label>Projects</label>
    ${[4, 6, 8].map((n) =>
      `<button type="button" class="chip-btn ${state.n === n ? "on" : ""}" data-n="${n}">${n}</button>`
    ).join("")}
  `;
}

function renderState() {
  const dump = {
    projectCount: projects().length,
    selected: state.selectedId === "all" ? "all" : projectById(state.selectedId)?.name,
    sheetOpen: state.sheetOpen,
    confirmId: state.confirmId ? projectById(state.confirmId)?.name : null,
    query: state.query,
    lastAction: state.lastAction,
    visibleSessionCount: visibleSessions().length,
    projects: projects().map((p) => p.name),
    removed: [...state.removed].map((id) => projectById(id)?.name),
  };
  document.getElementById("state").textContent = JSON.stringify(dump, null, 2);
}

function render() {
  renderControls();
  renderApp();
  renderState();
}

function onAppClick(e) {
  if (state.suppressClick) {
    state.suppressClick = false;
    e.preventDefault();
    e.stopPropagation();
    return;
  }
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  const id = t.dataset.id;
  if (act === "select") selectFilter(id);
  else if (act === "dlg-card") e.stopPropagation();
  else if (act === "cancel-remove") {
    state.confirmId = null;
    state.lastAction = "cancel-remove";
    render();
  } else if (act === "confirm-remove") {
    const rid = state.confirmId;
    state.confirmId = null;
    if (rid) removeProject(rid);
  } else if (act === "open-sheet") {
    state.sheetOpen = true;
    state.lastAction = "open-sheet";
    render();
  } else if (act === "close-sheet") {
    if (state.confirmId) return;
    state.sheetOpen = false;
    state.query = "";
    state.lastAction = "close-sheet";
    render();
  } else if (act === "add") addProject();
  else if (act === "new") newSession();
  else if (act === "open-session") {
    state.lastAction = "open-session:" + id;
    render();
  }
}

function bindHoldToDelete() {
  const rows = document.querySelectorAll("#app-b .sheet-row[data-hold='1']");
  rows.forEach((row) => {
    let timer = 0;
    let startX = 0;
    let startY = 0;
    const clear = () => {
      clearTimeout(timer);
      timer = 0;
      row.classList.remove("pressing");
    };
    row.addEventListener("pointerdown", (e) => {
      if (e.button && e.button !== 0) return;
      if (state.confirmId) return;
      startX = e.clientX;
      startY = e.clientY;
      row.classList.add("pressing");
      timer = window.setTimeout(() => {
        timer = 0;
        row.classList.remove("pressing");
        row.classList.add("popping");
        state.suppressClick = true;
        try { navigator.vibrate?.(12); } catch (_) {}
        window.setTimeout(() => {
          state.confirmId = row.dataset.id;
          state.lastAction = "hold-remove:" + (projectById(row.dataset.id)?.name || "");
          render();
        }, 220);
      }, 420);
    });
    row.addEventListener("pointermove", (e) => {
      if (!timer) return;
      if (Math.hypot(e.clientX - startX, e.clientY - startY) > 18) clear();
    });
    row.addEventListener("pointerup", clear);
    row.addEventListener("pointercancel", clear);
    row.addEventListener("pointerleave", () => { if (timer) clear(); });
    row.addEventListener("contextmenu", (e) => e.preventDefault());
  });
}

document.getElementById("stage").addEventListener("click", onAppClick);
document.getElementById("controls").addEventListener("click", (e) => {
  const b = e.target.closest("[data-n]");
  if (!b) return;
  state.n = Number(b.dataset.n);
  state.removed.clear();
  if (state.selectedId !== "all" && !projects().some((p) => p.id === state.selectedId)) {
    state.selectedId = "all";
  }
  state.sheetOpen = false;
  state.lastAction = "count:" + state.n;
  setParams({ n: state.n });
  render();
});

(function init() {
  const p = params();
  state.n = [4, 6, 8].includes(p.n) ? p.n : 6;
  setParams({ n: state.n });
  render();
})();
</script>
</body>
</html>
