<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session screen — project identity prototypes</title>
<style>
  :root {
    --bg: #1C1C1C;
    --surface: #1C1C1C;
    --raised: #232323;
    --raised-hover: #282828;
    --text: #EDEDED;
    --text-base: #A0A0A0;
    --text-weak: #707070;
    --text-weaker: #505050;
    --border: #282828;
    --border-weaker: #232323;
    --icon: #7E7E7E;
    --icon-strong: #EDEDED;
    --success: #3DDC84;
    --interactive: #8CB0FF;
    --letter-a: #5B8DEF;
    --letter-b: #E07A5F;
    --letter-c: #81B29A;
    --phone-w: 390px;
    --phone-h: 844px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: #0e0e0e;
    color: var(--text);
    padding: 28px 20px 120px;
  }

  .page-meta {
    max-width: 920px;
    margin: 0 auto 28px;
  }
  .page-meta h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  .page-meta p {
    margin: 0;
    color: var(--text-base);
    font-size: 0.95rem;
    line-height: 1.5;
    max-width: 42rem;
  }
  .page-meta .tag {
    display: inline-block;
    margin-top: 12px;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-weak);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
  }

  .stage {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 32px;
    flex-wrap: wrap;
  }

  /* Phone chrome */
  .phone {
    width: var(--phone-w);
    height: var(--phone-h);
    background: var(--bg);
    border-radius: 44px;
    border: 1px solid #333;
    box-shadow:
      0 0 0 1px #111,
      0 24px 80px rgba(0,0,0,0.55);
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .phone-notch {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 34px;
    background: #000;
    border-radius: 20px;
    z-index: 20;
  }
  .status-bar {
    height: 54px;
    padding: 18px 28px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    position: relative;
    z-index: 5;
  }
  .status-bar .right {
    display: flex;
    gap: 6px;
    align-items: center;
    font-size: 12px;
    opacity: 0.9;
  }

  /* App shell */
  .app {
    height: calc(100% - 54px);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Top bar shared pieces */
  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px 10px 8px;
    min-height: 56px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar.no-divider { border-bottom: none; }
  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: none;
    color: var(--icon-strong);
    display: grid;
    place-items: center;
    flex-shrink: 0;
    cursor: default;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .title-block {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    height: 40px;
  }
  .title {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }
  .subtitle-row {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .caption {
    font-size: 12px;
    color: var(--text-base);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    flex-shrink: 0;
    box-shadow: 0 0 0 2px rgba(61, 220, 132, 0.18);
  }
  .status-dot.warn { background: #E8B339; box-shadow: 0 0 0 2px rgba(232,179,57,0.18); }
  .status-label {
    font-size: 12px;
    color: var(--text-base);
    text-transform: lowercase;
  }

  .letter {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: var(--letter-a);
    flex-shrink: 0;
  }
  .folder-icon {
    width: 14px;
    height: 14px;
    color: var(--icon);
    flex-shrink: 0;
  }

  /* Project strip (B) */
  .project-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px 10px;
    background: var(--raised);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .project-strip .name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .project-strip .path {
    font-size: 12px;
    color: var(--text-weak);
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Project chip (D) */
  .project-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 8px 3px 4px;
    align-self: flex-start;
  }
  .project-chip .chip-name {
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
  }
  .project-chip .chip-path {
    font-size: 11px;
    color: var(--text-weak);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 140px;
  }
  .project-chip .sep {
    color: var(--text-weaker);
    font-size: 11px;
  }

  /* Inline header project mark (C-ish / D alt) */
  .title-with-mark {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .title-with-mark .title { flex: 1; min-width: 0; }

  /* Breadcrumb top (variant C) */
  .crumb {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    font-size: 12px;
    color: var(--text-base);
  }
  .crumb .proj {
    color: var(--interactive);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 42%;
  }
  .crumb .sep { color: var(--text-weaker); flex-shrink: 0; }
  .crumb .sess {
    color: var(--text);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }

  /* Timeline / messages */
  .timeline {
    flex: 1;
    overflow: hidden;
    padding: 16px 16px 120px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg-user {
    align-self: flex-end;
    max-width: 82%;
    background: var(--raised);
    border-radius: 16px 16px 4px 16px;
    padding: 10px 14px;
    font-size: 15px;
    line-height: 1.4;
    color: var(--text);
  }
  .msg-assistant {
    align-self: stretch;
    font-size: 15px;
    line-height: 1.45;
    color: var(--text);
  }
  .msg-assistant .meta {
    font-size: 11px;
    color: var(--text-weak);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .tool-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    background: transparent;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .tool-card .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--success); margin-top: 5px; flex-shrink: 0;
  }
  .tool-card .t { font-size: 14px; font-weight: 600; }
  .tool-card .s { font-size: 12px; color: var(--text-weak); margin-top: 2px; }

  /* Composer */
  .composer-wrap {
    position: absolute;
    left: 12px; right: 12px; bottom: 18px;
    z-index: 10;
  }
  .composer {
    background: rgba(35,35,35,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 10px 12px 10px 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
  }
  .composer-input {
    color: var(--text-weak);
    font-size: 15px;
    padding: 4px 0 10px;
  }
  .composer-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .choice {
    font-size: 12px;
    color: var(--text-base);
    background: rgba(255,255,255,0.06);
    border-radius: 999px;
    padding: 5px 10px;
    border: 1px solid transparent;
  }
  .send {
    margin-left: auto;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--text);
    color: #111;
    display: grid;
    place-items: center;
    border: none;
  }
  .send svg { width: 16px; height: 16px; }

  /* Variant E: project footer under composer choices */
  .composer-project {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 4px 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .composer-project .name {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }
  .composer-project .path {
    font-size: 11px;
    color: var(--text-weak);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Baseline callout */
  .baseline-note {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 78%;
    text-align: center;
    color: var(--text-weak);
    font-size: 13px;
    line-height: 1.45;
    pointer-events: none;
    display: none;
  }
  .phone[data-variant="0"] .baseline-note { display: block; opacity: 0.55; }

  /* Floating switcher */
  .switcher {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 4px;
    background: #f5f5f5;
    color: #111;
    border-radius: 999px;
    padding: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.08);
    font-size: 13px;
    font-weight: 600;
    max-width: calc(100vw - 24px);
  }
  .switcher button {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: #e8e8e8;
    color: #111;
    cursor: pointer;
    font-size: 16px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .switcher button:hover { background: #ddd; }
  .switcher .label {
    padding: 0 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: min(320px, 60vw);
    text-align: center;
  }
  .switcher .label small {
    display: block;
    font-weight: 500;
    font-size: 11px;
    color: #666;
    margin-top: 1px;
  }

  .variant-panel { display: none; }
  .variant-panel.active { display: contents; }

  /* State dump for prototype skill "surface the state" */
  .state-dump {
    max-width: 920px;
    margin: 24px auto 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--text-weak);
    background: #151515;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
  <!--
    PROTOTYPE — throwaway.
    Question: How should session chat surface which project (worktree) the session belongs to?
    Five variants (0 = current baseline) via ?variant=0..4, switchable from the floating bar.
    Available data: displayName (basename), worktree path, letter accent, connection status, session title.
  -->

  <header class="page-meta">
    <h1>Session screen — project identity</h1>
    <p>
      Right now chat only shows the session title and a live/offline status dot.
      The worktree is already known for API scoping but never displayed.
      Flip variants below and pick a structure (or mix pieces).
    </p>
    <span class="tag">Prototype · not production</span>
  </header>

  <div class="stage">
    <div class="phone" id="phone" data-variant="0">
      <div class="phone-notch"></div>
      <div class="status-bar">
        <span>9:41</span>
        <span class="right">●●●● ▮</span>
      </div>
      <div class="app" id="app">
        <!-- filled by JS -->
      </div>
    </div>
  </div>

  <div class="state-dump" id="state"></div>

  <div class="switcher" id="switcher" role="toolbar" aria-label="Prototype variant switcher">
    <button type="button" id="prev" aria-label="Previous variant">←</button>
    <div class="label" id="label">A — Baseline</div>
    <button type="button" id="next" aria-label="Next variant">→</button>
  </div>

<script>
const DATA = {
  sessionTitle: "Wire session project chrome",
  displayName: "opencode-mobile",
  worktree: "/Users/ivan/Projects/opencode-mobile",
  compactPath: "~/Projects/opencode-mobile",
  letter: "O",
  letterColor: "var(--letter-a)",
  connection: "live",
};

const VARIANTS = [
  {
    key: "0",
    name: "Baseline",
    blurb: "Current: title + status only — no project",
    render() {
      return topBar({
        title: DATA.sessionTitle,
        status: true,
      }) + timeline() + composer();
    },
  },
  {
    key: "A",
    name: "Top-bar subtitle",
    blurb: "Session title; project name+path as second line; status as trailing live pill",
    render() {
      return topBar({
        title: DATA.sessionTitle,
        subtitleHtml: `
          <span class="subtitle-row">
            ${folderSvg()}
            <span class="caption"><strong style="color:var(--text);font-weight:600">${esc(DATA.displayName)}</strong>
            <span style="color:var(--text-weaker)"> · </span>${esc(DATA.compactPath)}</span>
          </span>`,
        trailingStatus: true,
      }) + timeline() + composer();
    },
  },
  {
    key: "B",
    name: "Context strip",
    blurb: "Keep title+statusDot; dedicated strip under bar with letter + name + path",
    render() {
      return topBar({
        title: DATA.sessionTitle,
        status: true,
      }) + `
        <div class="project-strip">
          <div class="letter" style="background:${DATA.letterColor}">${DATA.letter}</div>
          <span class="name">${esc(DATA.displayName)}</span>
          <span class="path">${esc(DATA.compactPath)}</span>
        </div>
      ` + timeline() + composer();
    },
  },
  {
    key: "C",
    name: "Project-first title",
    blurb: "Top bar title = project; session title as subtitle; status trailing",
    render() {
      return topBar({
        titleHtml: `
          <div class="title-with-mark">
            <div class="letter" style="background:${DATA.letterColor}">${DATA.letter}</div>
            <div class="title">${esc(DATA.displayName)}</div>
          </div>`,
        subtitleHtml: `<span class="caption">${esc(DATA.sessionTitle)}</span>`,
        trailingStatus: true,
      }) + timeline() + composer();
    },
  },
  {
    key: "D",
    name: "Breadcrumb + chip",
    blurb: "Crumb project › session as title line; compact path chip under it",
    render() {
      return topBar({
        titleHtml: `
          <div class="crumb">
            <span class="proj">${esc(DATA.displayName)}</span>
            <span class="sep">›</span>
            <span class="sess">${esc(DATA.sessionTitle)}</span>
          </div>`,
        subtitleHtml: `
          <div class="project-chip">
            <div class="letter" style="width:16px;height:16px;font-size:9px;border-radius:4px;background:${DATA.letterColor}">${DATA.letter}</div>
            <span class="chip-path">${esc(DATA.compactPath)}</span>
            <span class="sep">·</span>
            <span class="status-dot" style="width:6px;height:6px"></span>
            <span class="status-label">live</span>
          </div>`,
      }) + timeline() + composer();
    },
  },
  {
    key: "E",
    name: "Composer anchor",
    blurb: "Chrome stays baseline; project identity lives on the composer surface",
    render() {
      return topBar({
        title: DATA.sessionTitle,
        status: true,
      }) + timeline() + composer({ showProject: true });
    },
  },
];

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function folderSvg() {
  return `<svg class="folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>`;
}

function backBtn() {
  return `<button class="icon-btn" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>`;
}

function moreBtn() {
  return `<button class="icon-btn" aria-label="More">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="6" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18" r="1.6"/></svg>
  </button>`;
}

function livePill() {
  return `<div class="subtitle-row" style="background:rgba(61,220,132,0.12);border-radius:999px;padding:6px 10px;gap:5px;flex-shrink:0">
    <span class="status-dot"></span>
    <span class="status-label" style="color:var(--success);font-weight:600">live</span>
  </div>`;
}

function topBar({ title, titleHtml, subtitleHtml, status, trailingStatus }) {
  const titleInner = titleHtml ?? `<div class="title">${esc(title)}</div>`;
  let second = "";
  if (status) {
    second = `<div class="subtitle-row"><span class="status-dot"></span><span class="status-label">live</span></div>`;
  } else if (subtitleHtml) {
    second = subtitleHtml;
  }
  return `
    <div class="topbar">
      ${backBtn()}
      <div class="title-block">
        ${titleInner}
        ${second}
      </div>
      ${trailingStatus ? livePill() : ""}
      ${moreBtn()}
    </div>`;
}

function timeline() {
  return `
    <div class="timeline">
      <div class="msg-user">Can we show which project this session belongs to on the chat screen?</div>
      <div class="msg-assistant">
        <div class="meta">Assistant · build</div>
        Chat already scopes API calls with <code style="background:rgba(255,255,255,0.08);padding:1px 5px;border-radius:4px;font-size:13px">directory=worktree</code>,
        but the header never surfaces it. Home already has displayName + compact path + letter badge.
      </div>
      <div class="tool-card">
        <div class="dot"></div>
        <div>
          <div class="t">Read · SessionChatScreen.kt</div>
          <div class="s">title + statusDot only · worktree in nav args</div>
        </div>
      </div>
      <div class="baseline-note">No project identity in chrome — this is today's screen.</div>
    </div>`;
}

function composer({ showProject } = {}) {
  const proj = showProject ? `
    <div class="composer-project">
      <div class="letter" style="width:18px;height:18px;font-size:10px;border-radius:5px;background:${DATA.letterColor}">${DATA.letter}</div>
      <span class="name">${esc(DATA.displayName)}</span>
      <span class="path">${esc(DATA.compactPath)}</span>
    </div>` : "";
  return `
    <div class="composer-wrap">
      <div class="composer">
        ${proj}
        <div class="composer-input">Message opencode…</div>
        <div class="composer-row">
          <span class="choice">build ▾</span>
          <span class="choice">claude-sonnet ▾</span>
          <button class="send" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
    </div>`;
}

function getVariantIndex() {
  const p = new URLSearchParams(location.search).get("variant");
  if (p == null) return 0;
  const byKey = VARIANTS.findIndex(v => v.key === p || v.key.toLowerCase() === String(p).toLowerCase());
  if (byKey >= 0) return byKey;
  const n = parseInt(p, 10);
  if (!Number.isNaN(n) && n >= 0 && n < VARIANTS.length) return n;
  return 0;
}

function setVariant(index) {
  const i = ((index % VARIANTS.length) + VARIANTS.length) % VARIANTS.length;
  const v = VARIANTS[i];
  const url = new URL(location.href);
  url.searchParams.set("variant", v.key);
  history.replaceState(null, "", url);

  document.getElementById("phone").dataset.variant = v.key;
  document.getElementById("app").innerHTML = v.render();
  document.getElementById("label").innerHTML =
    `${v.key === "0" ? "0" : v.key} — ${esc(v.name)}<small>${esc(v.blurb)}</small>`;
  document.getElementById("state").textContent =
    `variant=${v.key} (${v.name})\n` +
    `sessionTitle=${DATA.sessionTitle}\n` +
    `displayName=${DATA.displayName}\n` +
    `worktree=${DATA.worktree}\n` +
    `compactPath=${DATA.compactPath}\n` +
    `letter=${DATA.letter}\n` +
    `connection=${DATA.connection}\n` +
    `note=${v.blurb}`;
}

document.getElementById("prev").addEventListener("click", () => setVariant(getVariantIndex() - 1));
document.getElementById("next").addEventListener("click", () => setVariant(getVariantIndex() + 1));

document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); setVariant(getVariantIndex() - 1); }
  if (e.key === "ArrowRight") { e.preventDefault(); setVariant(getVariantIndex() + 1); }
});

setVariant(getVariantIndex());
</script>
</body>
</html>
