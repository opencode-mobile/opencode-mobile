<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    :root {
      color-scheme: light dark;
      --background-base: transparent;
      --surface-base: #f8f8f8;
      --surface-raised-base: #f3f3f3;
      --text-strong: #171717;
      --text-base: #6f6f6f;
      --text-weak: #8f8f8f;
      --text-interactive-base: #034cff;
      --border-weaker-base: #e8e8e8;
      --diff-add: #9ff29a;
      --diff-delete: #fc533a;
      --syntax-comment: #7a7a7a;
      --syntax-keyword: #a753ae;
      --syntax-string: #00ceb9;
      --syntax-primitive: #034cff;
      --syntax-property: #a753ae;
      --syntax-type: #8a6f00;
      --syntax-constant: #007b80;
      --syntax-critical: #ff8c00;
      --syntax-diff-delete: #ff8c00;
      --syntax-diff-unknown: #a753ae;
      --markdown-code-bg: rgba(0, 0, 0, 0.06);
    }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-strong);
    }
    #root {
      box-sizing: border-box;
      width: 100%;
    }
    .markdown {
      overflow-wrap: anywhere;
    }
    .markdown > *:first-child { margin-top: 0; }
    .markdown > *:last-child { margin-bottom: 0; }
    p { margin: 0 0 0.65em; }
    h1, h2, h3 {
      color: var(--text-strong);
      font-weight: 600;
      line-height: 1.25;
      margin: 0.9em 0 0.4em;
    }
    h1 { font-size: 1.25em; }
    h2 { font-size: 1.12em; }
    h3 { font-size: 1em; }
    strong { color: var(--text-strong); font-weight: 650; }
    em { color: var(--text-base); }
    a {
      color: var(--text-interactive-base);
      text-decoration-color: var(--text-interactive-base);
      text-underline-offset: 0.16em;
    }
    ul, ol { margin: 0 0 0.65em; padding-left: 1.35em; }
    li { margin: 0.15em 0; }
    blockquote {
      margin: 0 0 0.65em;
      padding: 0.1em 0 0.1em 0.75em;
      color: var(--text-base);
      border-left: 3px solid var(--text-interactive-base);
    }
    code {
      font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--text-strong);
      background: var(--markdown-code-bg);
      border-radius: 4px;
      padding: 0.08em 0.28em;
    }
    pre {
      margin: 0.75em 0;
      padding: 0.85em;
      overflow-x: auto;
      background: var(--surface-raised-base);
      border: 1px solid var(--border-weaker-base);
      border-radius: 8px;
      -webkit-overflow-scrolling: touch;
    }
    pre code {
      display: block;
      min-width: max-content;
      padding: 0;
      background: transparent;
      border-radius: 0;
      white-space: pre;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.75em 0;
      font-size: 0.92em;
    }
    th, td {
      border: 1px solid var(--border-weaker-base);
      padding: 0.45em 0.55em;
      text-align: left;
      vertical-align: top;
    }
    th {
      color: var(--text-strong);
      background: var(--surface-raised-base);
      font-weight: 600;
    }
    .tok-comment { color: var(--syntax-comment); }
    .tok-keyword { color: var(--syntax-keyword); }
    .tok-string { color: var(--syntax-string); }
    .tok-number { color: var(--syntax-primitive); }
    .tok-property { color: var(--syntax-property); }
    .tok-type { color: var(--syntax-type); }
    .tok-constant { color: var(--syntax-constant); }
    .tok-critical { color: var(--syntax-critical); }
    .language-diff .line {
      display: block;
      min-height: 1.45em;
    }
    .language-diff .diff-add { color: var(--diff-add); }
    .language-diff .diff-delete { color: var(--diff-delete); }
    .language-diff .diff-meta { color: var(--syntax-diff-unknown); }
  </style>
</head>
<body>
  <main id="root" class="markdown"></main>
  <script>
    (function () {
      const root = document.getElementById("root");
      let lastPayload = null;
      let debounceTimer = 0;

      function post(message) {
        try {
          if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.openCodeRenderedMarkdown) {
            window.webkit.messageHandlers.openCodeRenderedMarkdown.postMessage(message);
            return;
          }
        } catch (_) {}
        try {
          if (window.OpenCodeRenderedMarkdownBridge && window.OpenCodeRenderedMarkdownBridge.postMessage) {
            window.OpenCodeRenderedMarkdownBridge.postMessage(JSON.stringify(message));
          }
        } catch (_) {}
      }

      function applyTokens(tokens) {
        if (!tokens) return;
        for (const key of Object.keys(tokens)) {
          if (/^[a-z0-9-]+$/.test(key) && typeof tokens[key] === "string") {
            document.documentElement.style.setProperty("--" + key, tokens[key]);
          }
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function sanitizeUrl(value) {
        try {
          const url = new URL(value, "https://opencode.local");
          if (url.protocol === "http:" || url.protocol === "https:") return url.href;
        } catch (_) {}
        return "";
      }

      function inlineMarkdown(text) {
        let value = escapeHtml(text);
        value = value.replace(/`([^`\n]+)`/g, "<code>$1</code>");
        value = value.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        value = value.replace(/__([^_]+)__/g, "<strong>$1</strong>");
        value = value.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        value = value.replace(/_([^_]+)_/g, "<em>$1</em>");
        value = value.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, label, href) {
          const safe = sanitizeUrl(href);
          return safe ? '<a href="' + escapeHtml(safe) + '">' + label + "</a>" : label;
        });
        return value;
      }

      function highlightCode(code, language) {
        if (language === "diff") {
          return code.split("\n").map(function (line) {
            const cls = line.startsWith("+") ? "diff-add" : line.startsWith("-") ? "diff-delete" : line.startsWith("@@") ? "diff-meta" : "";
            return '<span class="line ' + cls + '">' + escapeHtml(line) + "</span>";
          }).join("\n");
        }
        let html = escapeHtml(code);
        html = html.replace(/(&quot;.*?&quot;|&#39;.*?&#39;)/g, '<span class="tok-string">$1</span>');
        html = html.replace(/\b(const|let|var|func|function|class|struct|enum|if|else|for|while|return|import|from|switch|case|when|val|suspend|async|await|try|catch|throw)\b/g, '<span class="tok-keyword">$1</span>');
        html = html.replace(/\b(true|false|null|nil|undefined|self|this)\b/g, '<span class="tok-constant">$1</span>');
        html = html.replace(/\b([0-9]+(?:\.[0-9]+)?)\b/g, '<span class="tok-number">$1</span>');
        html = html.replace(/(\/\/.*)$/gm, '<span class="tok-comment">$1</span>');
        return html;
      }

      function renderBlocks(markdown) {
        const fences = [];
        let text = markdown.replace(/```([A-Za-z0-9_+.-]*)\n([\s\S]*?)```/g, function (_, lang, code) {
          const id = fences.length;
          fences.push({ lang: (lang || "text").toLowerCase(), code: code.replace(/\n$/, "") });
          return "\n\u0000FENCE" + id + "\u0000\n";
        });
        const lines = text.replace(/\r\n/g, "\n").split("\n");
        const html = [];
        let paragraph = [];
        let list = null;
        let quote = [];
        let table = [];

        function flushParagraph() {
          if (paragraph.length) {
            html.push("<p>" + inlineMarkdown(paragraph.join(" ")) + "</p>");
            paragraph = [];
          }
        }
        function flushList() {
          if (list) {
            html.push("<" + list.type + ">" + list.items.map(function (item) { return "<li>" + inlineMarkdown(item) + "</li>"; }).join("") + "</" + list.type + ">");
            list = null;
          }
        }
        function flushQuote() {
          if (quote.length) {
            html.push("<blockquote>" + inlineMarkdown(quote.join(" ")) + "</blockquote>");
            quote = [];
          }
        }
        function flushTable() {
          if (table.length) {
            const rows = table.filter(function (row) { return !/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(row); });
            if (rows.length) {
              html.push("<table>" + rows.map(function (row, index) {
                const cells = row.replace(/^\||\|$/g, "").split("|").map(function (cell) { return inlineMarkdown(cell.trim()); });
                const tag = index === 0 ? "th" : "td";
                return "<tr>" + cells.map(function (cell) { return "<" + tag + ">" + cell + "</" + tag + ">"; }).join("") + "</tr>";
              }).join("") + "</table>");
            }
            table = [];
          }
        }
        function flushAll() {
          flushParagraph();
          flushList();
          flushQuote();
          flushTable();
        }

        for (const line of lines) {
          const fenceMatch = line.match(/^\u0000FENCE(\d+)\u0000$/);
          if (fenceMatch) {
            flushAll();
            const fence = fences[Number(fenceMatch[1])];
            const lang = fence.lang || "text";
            html.push('<pre class="language-' + escapeHtml(lang) + '"><code>' + highlightCode(fence.code, lang) + "</code></pre>");
            continue;
          }
          if (!line.trim()) {
            flushAll();
            continue;
          }
          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            flushAll();
            html.push("<h" + heading[1].length + ">" + inlineMarkdown(heading[2]) + "</h" + heading[1].length + ">");
            continue;
          }
          const unordered = line.match(/^\s*[-*+]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
          if (unordered || ordered) {
            flushParagraph();
            flushQuote();
            flushTable();
            const type = ordered ? "ol" : "ul";
            if (!list || list.type !== type) list = { type, items: [] };
            list.items.push((unordered || ordered)[1]);
            continue;
          }
          const quoted = line.match(/^>\s?(.+)$/);
          if (quoted) {
            flushParagraph();
            flushList();
            flushTable();
            quote.push(quoted[1]);
            continue;
          }
          if (line.includes("|") && line.trim().startsWith("|")) {
            flushParagraph();
            flushList();
            flushQuote();
            table.push(line);
            continue;
          }
          flushList();
          flushQuote();
          flushTable();
          paragraph.push(line.trim());
        }
        flushAll();
        return html.join("");
      }

      function measure(renderId) {
        requestAnimationFrame(function () {
          const rectHeight = root.getBoundingClientRect ? root.getBoundingClientRect().height : 0;
          const height = Math.max(root.scrollHeight, root.offsetHeight, rectHeight);
          post({ type: "height", height: Math.ceil(height), renderId: renderId || "" });
        });
      }

      function renderNow(payload) {
        lastPayload = payload || lastPayload;
        if (!lastPayload) return;
        applyTokens(lastPayload.tokens);
        root.className = "markdown " + (lastPayload.variant || "standalone");
        root.innerHTML = renderBlocks(lastPayload.markdown || "");
        measure(lastPayload.renderId);
      }

      document.addEventListener("click", function (event) {
        const link = event.target.closest && event.target.closest("a[href]");
        if (!link) return;
        event.preventDefault();
        const href = sanitizeUrl(link.getAttribute("href"));
        if (href) post({ type: "link", url: href, renderId: lastPayload && lastPayload.renderId || "" });
      });

      if (window.ResizeObserver) {
        new ResizeObserver(function () {
          if (lastPayload) measure(lastPayload.renderId);
        }).observe(root);
      }
      window.addEventListener("resize", function () {
        if (lastPayload) measure(lastPayload.renderId);
      });

      window.OpenCodeRenderedMarkdown = {
        render: function (payload) {
          window.clearTimeout(debounceTimer);
          if (payload && payload.isStreaming) {
            debounceTimer = window.setTimeout(function () { renderNow(payload); }, 80);
          } else {
            renderNow(payload);
          }
        }
      };

      post({ type: "ready" });
    })();
  </script>
</body>
</html>
