name: iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'opencode-mobile/opencode-mobile'
    runs-on: [self-hosted, macOS, mac-mini]
    defaults:
      run:
        working-directory: ios/OpenCode Mobile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Android compile SDK 37
        working-directory: .
        run: ./scripts/ensure-android-platform.sh 37

      - name: Resolve Swift Package dependencies
        run: bash ../../.github/scripts/resolve-ios-packages.sh

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project "OpenCode Mobile.xcodeproj" \
            -scheme "OpenCode Mobile" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
