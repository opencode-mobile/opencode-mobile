name: iOS Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "App Store marketing version: MAJOR.MINOR.PATCH. Leave empty to use ios/VERSION (or the repo VERSION file when it is absent)."
        required: false
        type: string
      verify_crashlytics:
        description: "Record one Crashlytics verification non-fatal for this build"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'opencode-mobile/opencode-mobile' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, mac-mini]
    environment: ios-release
    defaults:
      run:
        working-directory: ios/OpenCode Mobile
    env:
      IOS_MARKETING_VERSION: ${{ inputs.version_name }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      IOS_VERIFY_CRASHLYTICS: ${{ inputs.verify_crashlytics }}
      EXPECTED_TEAM_ID: 677MTXPXZZ
      EXPECTED_BUNDLE_ID: dev.opencode.mobile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write Firebase client config
        # Untracked so public clones build without Firebase; release CI injects it.
        working-directory: .
        shell: bash
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64:-}" ]]; then
            echo "IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 is required in this workflow's environment." >&2
            exit 1
          fi
          printf '%s' "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > "ios/OpenCode Mobile/OpenCode Mobile/GoogleService-Info.plist"
          test -s "ios/OpenCode Mobile/OpenCode Mobile/GoogleService-Info.plist"

      - name: Resolve marketing version
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${IOS_MARKETING_VERSION:-}" ]]; then
            IOS_MARKETING_VERSION="$(./scripts/read-app-version.sh ios)"
          fi
          echo "IOS_MARKETING_VERSION=$IOS_MARKETING_VERSION" >> "$GITHUB_ENV"

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          # App Store Connect rejects prerelease marketing versions
          # (CFBundleShortVersionString must be 1–3 period-separated integers).
          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$IOS_MARKETING_VERSION" =~ $version_pattern ]]; then
            echo "version_name must match MAJOR.MINOR.PATCH (integers only; no -PRERELEASE)." >&2
            exit 1
          fi
          if [[ ! "$IOS_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "GitHub run number did not produce a positive build number." >&2
            exit 1
          fi
          case "${IOS_VERIFY_CRASHLYTICS}" in
            true|false) ;;
            *)
              echo "verify_crashlytics must be a boolean (got: ${IOS_VERIFY_CRASHLYTICS})." >&2
              exit 1
              ;;
          esac

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android compile SDK 37
        working-directory: .
        run: ./scripts/ensure-android-platform.sh 37

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${ASC_API_KEY_P8:-}" || -z "${ASC_KEY_ID:-}" || -z "${ASC_ISSUER_ID:-}" ]]; then
            echo "ASC_API_KEY_P8, ASC_KEY_ID, and ASC_ISSUER_ID are required in the ios-release environment." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          {
            echo "ASC_API_KEY_PATH=$key_path"
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Prepare persistent signing keychain
        shell: bash
        run: |
          set -euo pipefail
          # Headless Actions cannot unlock the login keychain ("User interaction
          # is not allowed"). Use a runner-local persistent keychain so
          # ASC-created Development/Distribution private keys survive across
          # jobs. Deleting an ephemeral keychain orphans cloud certificates.
          keychain_dir="${HOME}/.opencode-mobile"
          keychain_path="${keychain_dir}/ios-release.keychain-db"
          password_path="${keychain_dir}/ios-release.keychain.password"
          mkdir -p "$keychain_dir"
          chmod 700 "$keychain_dir"
          if [[ ! -f "$password_path" ]]; then
            openssl rand -base64 32 | tr -d '\n/=+' > "$password_path"
            chmod 600 "$password_path"
          fi
          keychain_password="$(tr -d '\n' < "$password_path")"
          if [[ ! -f "$keychain_path" ]]; then
            security create-keychain -p "$keychain_password" "$keychain_path"
          fi
          # Locked keychains reject set-keychain-settings with
          # "User interaction is not allowed" (exit 36). Unlock first.
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          existing_keychains=()
          while IFS= read -r line; do
            keychain="${line#\"}"
            keychain="${keychain%\"}"
            keychain="$(printf '%s' "$keychain" | sed -E 's/^[[:space:]]+//;s/[[:space:]]+$//')"
            [[ -z "$keychain" || "$keychain" == "$keychain_path" ]] && continue
            existing_keychains+=("$keychain")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]+"${existing_keychains[@]}"}"
          security default-keychain -s "$keychain_path"
          # Partition ACL may no-op on an empty keychain; re-applied after archive.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" \
            "$keychain_path" >/dev/null 2>&1 || true
          {
            echo "IOS_RELEASE_KEYCHAIN_PATH=$keychain_path"
            echo "IOS_RELEASE_KEYCHAIN_PASSWORD_PATH=$password_path"
          } >> "$GITHUB_ENV"

      - name: Resolve Swift Package dependencies
        run: bash ../../.github/scripts/resolve-ios-packages.sh

      - name: Archive Release for iOS device
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/OpenCode-Mobile.xcarchive"
          keychain_password="$(tr -d '\n' < "$IOS_RELEASE_KEYCHAIN_PASSWORD_PATH")"
          # Keep the persistent signing keychain unlocked for the long archive.
          security unlock-keychain -p "$keychain_password" "$IOS_RELEASE_KEYCHAIN_PATH"
          # Xcode 26.x Release WMO crashes the Swift frontend on this target
          # (SILPerformanceInliner). Keep Release configuration/signing, but
          # compile without WMO until Apple fixes the optimizer.
          # Gate Crashlytics verification via app Info.plist only. Do not pass
          # SWIFT_ACTIVE_COMPILATION_CONDITIONS project-wide — that leaks into
          # Firebase SPM packages and breaks GoogleUtilities module resolution.
          if [[ "${IOS_VERIFY_CRASHLYTICS}" == "true" ]]; then
            plist_path="OpenCode Mobile/AppTransportSecurity.plist"
            if /usr/libexec/PlistBuddy -c "Print :OpenCodeVerifyCrashlytics" "$plist_path" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :OpenCodeVerifyCrashlytics true" "$plist_path"
            else
              /usr/libexec/PlistBuddy -c "Add :OpenCodeVerifyCrashlytics bool true" "$plist_path"
            fi
          fi
          xcodebuild archive \
            -project "OpenCode Mobile.xcodeproj" \
            -scheme "OpenCode Mobile" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$IOS_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$EXPECTED_TEAM_ID" \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            SWIFT_COMPILATION_MODE=singlefile
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" \
            "$IOS_RELEASE_KEYCHAIN_PATH" >/dev/null 2>&1 || true
          echo "IOS_ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"

      - name: Export signed App Store IPA
        run: |
          set -euo pipefail
          keychain_password="$(tr -d '\n' < "$IOS_RELEASE_KEYCHAIN_PASSWORD_PATH")"
          security unlock-keychain -p "$keychain_password" "$IOS_RELEASE_KEYCHAIN_PATH"
          export_dir="$RUNNER_TEMP/ios-ipa-export"
          mkdir -p "$export_dir"
          xcodebuild -exportArchive \
            -archivePath "$IOS_ARCHIVE_PATH" \
            -exportPath "$export_dir" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/.github/ios/ExportOptions-AppStore.plist" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ipa_path="$(find "$export_dir" -maxdepth 1 -name '*.ipa' -type f | head -n 1)"
          if [[ -z "$ipa_path" ]]; then
            echo "No IPA produced by exportArchive." >&2
            ls -la "$export_dir" >&2 || true
            exit 1
          fi
          echo "IOS_IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Verify IPA signature
        working-directory: .
        run: |
          .github/scripts/verify-ios-release-ipa.sh \
            "$IOS_IPA_PATH" \
            "$EXPECTED_TEAM_ID" \
            "$EXPECTED_BUNDLE_ID"

      - name: Upload IPA to App Store Connect
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          if [[ -z "${ASC_KEY_ID:-}" || -z "${ASC_ISSUER_ID:-}" ]]; then
            echo "ASC_KEY_ID and ASC_ISSUER_ID must be prepared before upload." >&2
            exit 1
          fi
          if [[ ! -f "${API_PRIVATE_KEYS_DIR}/AuthKey_${ASC_KEY_ID}.p8" ]]; then
            echo "ASC API key file AuthKey_${ASC_KEY_ID}.p8 is missing from the runner temp directory." >&2
            exit 1
          fi
          echo "Uploading signature-verified IPA to App Store Connect for TestFlight Internal Testing."
          echo "Marketing version: ${IOS_MARKETING_VERSION}"
          echo "Build number: ${IOS_BUILD_NUMBER}"
          # Succeeds when ASC accepts the delivery. Processing and TestFlight
          # availability are a human follow-up; do not Submit for Review.
          xcrun altool --upload-package "$IOS_IPA_PATH" \
            --api-key "$ASC_KEY_ID" \
            --api-issuer "$ASC_ISSUER_ID" \
            --show-progress
          {
            echo "## iOS Release upload"
            echo ""
            echo "- Marketing version (\`CFBundleShortVersionString\`): \`${IOS_MARKETING_VERSION}\`"
            echo "- Build number (\`CFBundleVersion\`): \`${IOS_BUILD_NUMBER}\`"
            echo "- Crashlytics verification non-fatal: \`${IOS_VERIFY_CRASHLYTICS}\`"
            echo "- ASC accepted the IPA upload."
            echo "- Wait for App Store Connect processing, then install via TestFlight **Internal Testing**."
            echo "- Do **not** Submit for Review, release the app, or create External TestFlight groups."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary ASC API key and restore keychain search list
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${ASC_API_KEY_PATH:-}" "$GITHUB_WORKSPACE/ios/OpenCode Mobile/OpenCode Mobile/GoogleService-Info.plist"
          # Keep the persistent signing keychain and its password on the runner.
          # Only restore the login keychain as the interactive default.
          if [[ -f "$HOME/Library/Keychains/login.keychain-db" ]]; then
            security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db"
            security default-keychain -s "$HOME/Library/Keychains/login.keychain-db" || true
          fi
          if [[ -n "${IOS_RELEASE_KEYCHAIN_PATH:-}" ]]; then
            security lock-keychain "$IOS_RELEASE_KEYCHAIN_PATH" >/dev/null 2>&1 || true
          fi
