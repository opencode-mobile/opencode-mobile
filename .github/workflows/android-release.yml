name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Semantic version: MAJOR.MINOR.PATCH[-PRERELEASE]. Leave empty to use the repo VERSION file."
        required: false
        type: string
      verify_crashlytics:
        description: "Record one Crashlytics verification non-fatal for this version"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, android]
    environment: android-release
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      ANDROID_VERIFY_CRASHLYTICS: ${{ inputs.verify_crashlytics }}
      EXPECTED_UPLOAD_CERT_SHA256: 9E:FB:99:19:6B:2D:F6:56:FD:FA:1D:88:3D:33:00:7E:0F:E0:DA:28:AB:FF:A6:F8:BC:C3:3D:42:0F:CA:E1:37

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write Firebase client config
        # Untracked so public clones build without Firebase; release CI injects it.
        working-directory: .
        shell: bash
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            echo "ANDROID_GOOGLE_SERVICES_JSON_BASE64 is required in this workflow's environment." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "android/app/google-services.json"
          test -s "android/app/google-services.json"

      - name: Resolve marketing version
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_VERSION_NAME:-}" ]]; then
            ANDROID_VERSION_NAME="$(./scripts/read-app-version.sh)"
          fi
          echo "ANDROID_VERSION_NAME=$ANDROID_VERSION_NAME" >> "$GITHUB_ENV"

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "$ANDROID_VERSION_NAME" =~ $version_pattern ]]; then
            echo "version_name must match MAJOR.MINOR.PATCH[-PRERELEASE]." >&2
            exit 1
          fi
          if [[ ! "$ANDROID_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "GitHub run number did not produce a positive versionCode." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android NDK for native symbols
        shell: bash
        run: |
          set -euo pipefail
          ndk_version="27.2.12479018"
          if [[ -d "${ANDROID_HOME:-}/ndk/${ndk_version}" ]]; then
            echo "NDK ${ndk_version} already installed."
            exit 0
          fi
          sdkmanager_bin=""
          if [[ -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            sdkmanager_bin="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager_bin="$(command -v sdkmanager)"
          else
            echo "sdkmanager not found; cannot install NDK ${ndk_version}." >&2
            exit 1
          fi
          yes | "$sdkmanager_bin" "ndk;${ndk_version}"

      - name: Prepare upload keystore
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/opencode-mobile-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed release artifacts
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Verify release signatures
        working-directory: .
        run: |
          .github/scripts/verify-android-release-signatures.sh \
            android/app/build/outputs/bundle/release/app-release.aab \
            android/app/build/outputs/apk/release/app-release.apk \
            "$EXPECTED_UPLOAD_CERT_SHA256"

      - name: Verify AAB symbolication metadata
        working-directory: .
        run: |
          .github/scripts/verify-android-aab-symbols.sh \
            android/app/build/outputs/bundle/release/app-release.aab \
            android/app/build/outputs/mapping/release/mapping.txt

      - name: Publish to Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.opencode.mobile
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: OpenCode Mobile ${{ env.ANDROID_VERSION_NAME }} (${{ github.run_number }})

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/opencode-mobile-upload.jks"
