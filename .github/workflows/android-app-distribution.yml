name: Android App Distribution

on:
  schedule:
    # Nightly at 02:00 UTC; skipped when main has no commits in the last 26 hours.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Optional main or full pull request head SHA to check out. Leave empty to distribute the selected workflow branch."
        required: false
        type: string
      variant:
        description: "release: the store-like build. lab: the benchmark build with the Highlighting Lab (#872)."
        required: false
        type: choice
        options:
          - release
          - lab
        default: release

permissions:
  contents: read
  pull-requests: read

# Manual dispatches and nightly runs queue in separate groups; a running build is never cancelled, but GitHub keeps only the newest queued run per group.
concurrency:
  group: android-app-distribution-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  changes:
    if: github.repository == 'opencode-mobile/opencode-mobile'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check for new commits on main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since="$(date -u -d '26 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          count="$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&since=$since&per_page=1" --jq 'length')"
          if [[ "$count" -gt 0 ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commits on main since $since; skipping nightly distribution."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  distribute:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: [self-hosted, Linux, X64, android]
    environment: android-release
    defaults:
      run:
        working-directory: android
    env:
      FIREBASE_APP_ID: 1:569439646238:android:593114316e11ddb48df40f
      FIREBASE_TESTER_GROUP: android-internal
      FIREBASE_TOOLS_VERSION: 15.24.0
      EXPECTED_UPLOAD_CERT_SHA256: 9E:FB:99:19:6B:2D:F6:56:FD:FA:1D:88:3D:33:00:7E:0F:E0:DA:28:AB:FF:A6:F8:BC:C3:3D:42:0F:CA:E1:37
      SOURCE_REF: ${{ github.event.inputs.source_ref }}
      DISTRIBUTION_VARIANT: ${{ github.event.inputs.variant || 'release' }}

    steps:
      - name: Validate source ref
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_REF:-}" ]]; then
            exit 0
          fi
          # Release secrets are attached to this job, so only main or the head commit of an
          # open same-repository pull request (sent by the /distribute comment) may be built (#755).
          case "$SOURCE_REF" in
            main|refs/heads/main) exit 0 ;;
          esac
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_ref must be main or a full pull request head SHA. Got: $SOURCE_REF" >&2
            exit 1
          fi
          open_same_repo_prs="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_REF/pulls" \
              --jq "[.[] | select(.state == \"open\" and .head.sha == \"$SOURCE_REF\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\")] | length"
          )"
          if [[ "$open_same_repo_prs" -lt 1 ]]; then
            echo "$SOURCE_REF is not the head of an open pull request from this repository." >&2
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.source_ref || github.sha }}

      - name: Write Firebase client config
        # Untracked so public clones build without Firebase; release CI injects it.
        working-directory: .
        shell: bash
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            echo "ANDROID_GOOGLE_SERVICES_JSON_BASE64 is required in this workflow's environment." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "android/app/google-services.json"
          test -s "android/app/google-services.json"

      - name: Record distributed commit
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          echo "DISTRIBUTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set distribution version
        shell: bash
        run: |
          set -euo pipefail
          version_code=$((1000000000 + GITHUB_RUN_NUMBER))
          if (( version_code > 2100000000 )); then
            echo "App Distribution versionCode exceeds the Android limit." >&2
            exit 1
          fi
          marketing_version="$(../scripts/read-app-version.sh)"
          case "$DISTRIBUTION_VARIANT" in
            release) build_label=merge; gradle_task=":app:assembleRelease"; apk_path="app/build/outputs/apk/release/app-release.apk" ;;
            lab) build_label=lab; gradle_task=":app:assembleBenchmark"; apk_path="app/build/outputs/apk/benchmark/app-benchmark.apk" ;;
            *) echo "variant must be release or lab. Got: $DISTRIBUTION_VARIANT" >&2; exit 1 ;;
          esac
          {
            echo "ANDROID_VERSION_CODE=$version_code"
            echo "ANDROID_VERSION_NAME=${marketing_version}-${build_label}.$GITHUB_RUN_NUMBER"
            echo "ANDROID_GRADLE_TASK=$gradle_task"
            echo "ANDROID_APK_PATH=$apk_path"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android compile SDK 37
        working-directory: .
        run: ./scripts/ensure-android-platform.sh 37

      - name: Ensure Android NDK for native symbols
        shell: bash
        run: |
          set -euo pipefail
          ndk_version="27.2.12479018"
          if [[ -d "${ANDROID_HOME:-}/ndk/${ndk_version}" ]]; then
            echo "NDK ${ndk_version} already installed."
            exit 0
          fi
          sdkmanager_bin=""
          if [[ -x "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            sdkmanager_bin="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager_bin="$(command -v sdkmanager)"
          else
            echo "sdkmanager not found; cannot install NDK ${ndk_version}." >&2
            exit 1
          fi
          yes | "$sdkmanager_bin" "ndk;${ndk_version}"

      - name: Prepare protected credentials
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/opencode-mobile-upload.jks"
          firebase_credentials_path="$RUNNER_TEMP/firebase-app-distribution.json"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          printf '%s' "$FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_JSON" > "$firebase_credentials_path"
          chmod 600 "$keystore_path" "$firebase_credentials_path"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$firebase_credentials_path" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew "$ANDROID_GRADLE_TASK" --stacktrace

      - name: Verify APK signature
        working-directory: .
        run: |
          .github/scripts/verify-android-apk-signature.sh \
            "android/$ANDROID_APK_PATH" \
            "$EXPECTED_UPLOAD_CERT_SHA256"

      - name: Distribute to Firebase tester group
        shell: bash
        run: |
          set -euo pipefail
          distributed_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          subject="$(git log -1 --pretty=%s)"
          distributed_ref="${SOURCE_REF:-${GITHUB_REF_NAME:-}}"
          distributed_ref="${distributed_ref#refs/heads/}"
          distributed_ref="${distributed_ref#refs/tags/}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_notes="Dispatch $short_sha: $subject"
          else
            release_notes="Nightly $short_sha: $subject"
          fi
          if [[ -n "$distributed_ref" && "$distributed_ref" != "main" ]]; then
            release_notes="Not from main: $distributed_ref"$'\n'"$release_notes"
          fi
          if [[ "$DISTRIBUTION_VARIANT" == "lab" ]]; then
            release_notes="Lab build (#872): Highlighting Lab, no Crashlytics"$'\n'"$release_notes"
          fi
          if ! distribution_output="$(
            npx --yes "firebase-tools@$FIREBASE_TOOLS_VERSION" \
              appdistribution:distribute \
              "$ANDROID_APK_PATH" \
              --app "$FIREBASE_APP_ID" \
              --groups "$FIREBASE_TESTER_GROUP" \
              --release-notes "$release_notes" \
              2>&1
          )"; then
            printf '%s\n' "$distribution_output"
            exit 1
          fi
          firebase_console_uri="$(
            sed -n 's/^.*View this release in the Firebase console: //p' <<<"$distribution_output" | tail -n 1
          )"
          testing_uri="$(
            sed -n 's/^.*Share this release with testers who have access: //p' <<<"$distribution_output" | tail -n 1
          )"
          if [[ -z "$firebase_console_uri" || -z "$testing_uri" ]]; then
            echo "Firebase CLI did not return the expected stable release links." >&2
            exit 1
          fi
          {
            echo "## Android App Distribution"
            echo
            if [[ -n "$distributed_ref" && "$distributed_ref" != "main" ]]; then
              echo "- **Not from main:** \`$distributed_ref\`"
            fi
            echo "- Commit: \`$distributed_sha\`"
            echo "- Variant: \`$DISTRIBUTION_VARIANT\`"
            if [[ -n "${SOURCE_REF:-}" ]]; then
              echo "- Source ref: \`$SOURCE_REF\`"
            fi
            echo "- Version: \`$ANDROID_VERSION_NAME\` (\`$ANDROID_VERSION_CODE\`)"
            echo "- Tester group: \`$FIREBASE_TESTER_GROUP\`"
            echo "- [Firebase release]($firebase_console_uri)"
            echo "- [Open in the tester experience]($testing_uri)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/opencode-mobile-upload.jks" \
            "$RUNNER_TEMP/firebase-app-distribution.json" \
            "$GITHUB_WORKSPACE/android/app/google-services.json"
