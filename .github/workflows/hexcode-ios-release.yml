name: Hex Code iOS Release

# Uploads Hex Code (hexcode/README.md) to App Store Connect for TestFlight. Submitting for
# App Review and releasing are human steps in App Store Connect. Test builds for the Firebase
# tester group are hexcode-app-distribution.yml. Same runner, release environment, team and
# signing as ios-release.yml; Hex Code has no Firebase SDK, so no GoogleService-Info.plist.
#
# Hex Code has no What's new sheet, so there is no release-notes.json gate here.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "App Store marketing version: MAJOR.MINOR.PATCH. Leave empty to use MARKETING_VERSION in Hex Code.xcodeproj."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hexcode-ios-release
  cancel-in-progress: false

jobs:
  version:
    # GitHub-hosted on purpose: a plain check with no secrets.
    if: github.repository == 'opencode-mobile/opencode-mobile' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [[ -z "$version" ]]; then
            version="$(
              sed -nE 's/^[[:space:]]*MARKETING_VERSION = "?([0-9.]+)"?;$/\1/p' "ios/OpenCode Mobile/Hex Code.xcodeproj/project.pbxproj" | sort -u
            )"
          fi
          # App Store Connect rejects prerelease marketing versions
          # (CFBundleShortVersionString must be 1-3 period-separated integers).
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be one MAJOR.MINOR.PATCH (integers only; no -PRERELEASE). Got: '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    if: github.repository == 'opencode-mobile/opencode-mobile' && github.ref == 'refs/heads/main'
    needs: version
    runs-on: [self-hosted, macOS, mac-mini]
    environment: ios-release
    defaults:
      run:
        working-directory: ios/OpenCode Mobile
    env:
      # The same Xcode as ios-release.yml.
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      IOS_MARKETING_VERSION: ${{ needs.version.outputs.version }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}
      EXPECTED_TEAM_ID: 677MTXPXZZ
      EXPECTED_BUNDLE_ID: dev.opencode.hexcode

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IOS_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "GitHub run number did not produce a positive build number." >&2
            exit 1
          fi

      # Hex Code does not embed markdown-core, so no JDK, Gradle or Android SDK here.
      - name: Prepare App Store Connect API key
        shell: bash
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${ASC_API_KEY_P8:-}" || -z "${ASC_KEY_ID:-}" || -z "${ASC_ISSUER_ID:-}" ]]; then
            echo "ASC_API_KEY_P8, ASC_KEY_ID, and ASC_ISSUER_ID are required in the ios-release environment." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          {
            echo "ASC_API_KEY_PATH=$key_path"
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Prepare persistent signing keychain
        shell: bash
        run: |
          set -euo pipefail
          keychain_dir="${HOME}/.opencode-mobile"
          keychain_path="${keychain_dir}/ios-release.keychain-db"
          password_path="${keychain_dir}/ios-release.keychain.password"
          mkdir -p "$keychain_dir"
          chmod 700 "$keychain_dir"
          if [[ ! -f "$password_path" ]]; then
            openssl rand -base64 32 | tr -d '\n/=+' > "$password_path"
            chmod 600 "$password_path"
          fi
          keychain_password="$(tr -d '\n' < "$password_path")"
          if [[ ! -f "$keychain_path" ]]; then
            security create-keychain -p "$keychain_password" "$keychain_path"
          fi
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          existing_keychains=()
          while IFS= read -r line; do
            keychain="${line#\"}"
            keychain="${keychain%\"}"
            keychain="$(printf '%s' "$keychain" | sed -E 's/^[[:space:]]+//;s/[[:space:]]+$//')"
            [[ -z "$keychain" || "$keychain" == "$keychain_path" ]] && continue
            existing_keychains+=("$keychain")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]+"${existing_keychains[@]}"}"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" \
            "$keychain_path" >/dev/null 2>&1 || true
          {
            echo "IOS_RELEASE_KEYCHAIN_PATH=$keychain_path"
            echo "IOS_RELEASE_KEYCHAIN_PASSWORD_PATH=$password_path"
          } >> "$GITHUB_ENV"

      - name: Resolve Swift Package dependencies
        run: bash ../../.github/scripts/resolve-ios-packages.sh "Hex Code.xcodeproj" "Hex Code"

      - name: Archive Release for iOS device
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/Hex-Code-Release.xcarchive"
          keychain_password="$(tr -d '\n' < "$IOS_RELEASE_KEYCHAIN_PASSWORD_PATH")"
          security unlock-keychain -p "$keychain_password" "$IOS_RELEASE_KEYCHAIN_PATH"
          xcodebuild archive \
            -project "Hex Code.xcodeproj" \
            -scheme "Hex Code" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$IOS_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$EXPECTED_TEAM_ID"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" \
            "$IOS_RELEASE_KEYCHAIN_PATH" >/dev/null 2>&1 || true
          echo "IOS_ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"

      - name: Export signed App Store IPA
        run: |
          set -euo pipefail
          keychain_password="$(tr -d '\n' < "$IOS_RELEASE_KEYCHAIN_PASSWORD_PATH")"
          security unlock-keychain -p "$keychain_password" "$IOS_RELEASE_KEYCHAIN_PATH"
          export_dir="$RUNNER_TEMP/hexcode-ipa-export"
          mkdir -p "$export_dir"
          xcodebuild -exportArchive \
            -archivePath "$IOS_ARCHIVE_PATH" \
            -exportPath "$export_dir" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/.github/ios/ExportOptions-AppStore.plist" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ipa_path="$(find "$export_dir" -maxdepth 1 -name '*.ipa' -type f | head -n 1)"
          if [[ -z "$ipa_path" ]]; then
            echo "No IPA produced by exportArchive." >&2
            ls -la "$export_dir" >&2 || true
            exit 1
          fi
          echo "IOS_IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Verify IPA signature
        working-directory: .
        run: |
          .github/scripts/verify-ios-release-ipa.sh \
            "$IOS_IPA_PATH" \
            "$EXPECTED_TEAM_ID" \
            "$EXPECTED_BUNDLE_ID"

      - name: Upload IPA to App Store Connect
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          if [[ ! -f "${API_PRIVATE_KEYS_DIR}/AuthKey_${ASC_KEY_ID}.p8" ]]; then
            echo "ASC API key file AuthKey_${ASC_KEY_ID}.p8 is missing from the runner temp directory." >&2
            exit 1
          fi
          echo "Uploading signature-verified IPA to App Store Connect for TestFlight Internal Testing."
          echo "Marketing version: ${IOS_MARKETING_VERSION}"
          echo "Build number: ${IOS_BUILD_NUMBER}"
          # Succeeds when ASC accepts the delivery. Processing and TestFlight
          # availability are a human follow-up; do not Submit for Review.
          xcrun altool --upload-package "$IOS_IPA_PATH" \
            --api-key "$ASC_KEY_ID" \
            --api-issuer "$ASC_ISSUER_ID" \
            --show-progress
          {
            echo "## Hex Code iOS Release upload"
            echo ""
            echo "- Marketing version (\`CFBundleShortVersionString\`): \`${IOS_MARKETING_VERSION}\`"
            echo "- Build number (\`CFBundleVersion\`): \`${IOS_BUILD_NUMBER}\`"
            echo "- ASC accepted the IPA upload."
            echo "- Wait for App Store Connect processing, then install via TestFlight **Internal Testing**."
            echo "- Do **not** Submit for Review or release the app from here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary ASC API key and restore keychain search list
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${ASC_API_KEY_PATH:-}"
          if [[ -f "$HOME/Library/Keychains/login.keychain-db" ]]; then
            security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db"
            security default-keychain -s "$HOME/Library/Keychains/login.keychain-db" || true
          fi
          if [[ -n "${IOS_RELEASE_KEYCHAIN_PATH:-}" ]]; then
            security lock-keychain "$IOS_RELEASE_KEYCHAIN_PATH" >/dev/null 2>&1 || true
          fi

  tag:
    # Record the release: hexcode-ios-v<version> points at the commit this run shipped.
    # A rebuild of the same version moves the tag. The prefix keeps it out of the
    # ios-v* tags that release-notes.mjs reads for OpenCode Mobile.
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the shipped commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: hexcode-ios-v${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            echo "Moved $TAG to $GITHUB_SHA"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
            echo "Created $TAG at $GITHUB_SHA"
          fi
          echo "- Release tag: \`$TAG\` at \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
