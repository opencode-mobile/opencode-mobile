name: Android Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Fallback while pull_request delivery is unreliable: feature-branch pushes
  # still run Checks. Ignore main so merges don't double-bill with other workflows.
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Pre-existing style/lint debt; keep visible but do not block PR merge yet.
      - name: Run ktlint and Android Lint
        continue-on-error: true
        run: ./gradlew ktlintCheck lintDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
