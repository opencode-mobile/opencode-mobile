name: Android Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Skip when the change cannot affect the Android app.
    paths:
      - "android/**"
      - "shared/**"
      - "VERSION"
      - "scripts/read-app-version.sh"
      - "scripts/ensure-android-platform.sh"
      - ".github/scripts/**"
      - ".github/workflows/android-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-checks:
    # Self-hosted runner: never run pull requests from forks.
    if: github.repository == 'opencode-mobile/opencode-mobile' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, Linux, X64, android]
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate app VERSION
        working-directory: .
        run: ./scripts/read-app-version.sh

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android compile SDK 37
        working-directory: .
        run: ./scripts/ensure-android-platform.sh 37

      # Pre-existing style/lint debt; keep visible but do not block PR merge yet.
      - name: Run ktlint and Android Lint
        continue-on-error: true
        run: ./gradlew ktlintCheck lintDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
