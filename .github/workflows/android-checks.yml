name: Android Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Path filters live here, not under `on:`: a merge queue ignores `paths`, and
    # a workflow that never starts leaves a required check pending. A job
    # skipped by `if:` reports as skipped, which counts as passing.
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.match.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Match changed paths
        id: match
        env:
          EVENT: ${{ github.event_name }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PATTERNS: |
            # Skip when the change cannot affect the Android app.
            android/**
            shared/**
            # Hex Code has its own workflow (hexcode-android-checks.yml). Its build
            # scripts stay in: Gradle configures them on every Android build.
            !android/hexcode/**
            !shared/voice-engine/**
            android/hexcode/**/*.gradle.kts
            shared/voice-engine/**/*.gradle.kts
            VERSION
            scripts/read-app-version.sh
            scripts/ensure-android-platform.sh
            .github/scripts/**
            .github/workflows/android-checks.yml
            .github/scripts/changed-paths.py
        run: python3 .github/scripts/changed-paths.py

  android-checks:
    # Self-hosted runner: never run pull requests from forks.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' && (github.repository == 'opencode-mobile/opencode-mobile' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))) }}
    runs-on: [self-hosted, Linux, X64, android]
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate app VERSION
        working-directory: .
        run: ./scripts/read-app-version.sh

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Android compile SDK 37
        working-directory: .
        run: ./scripts/ensure-android-platform.sh 37

      # Pre-existing style/lint debt; keep visible but do not block PR merge yet.
      # Hex Code's modules run in hexcode-android-checks.yml, not here.
      - name: Run ktlint and Android Lint
        continue-on-error: true
        run: >-
          ./gradlew ktlintCheck lintDebug --stacktrace
          -x :hexcode:ktlintCheck -x :hexcode:lintDebug
          -x :voice-engine:ktlintCheck -x :voice-engine:lintDebug

      - name: Run unit tests
        run: >-
          ./gradlew testDebugUnitTest :test-guard:test --stacktrace
          -x :hexcode:testDebugUnitTest -x :voice-engine:testDebugUnitTest

      # Paparazzi 2 needs a Java 21 Gradle JVM; compile :screenshot so the
      # throwaway snapshot module cannot silently fall behind the app again.
      - name: Set up JDK 21 for the screenshot module
        id: jdk21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Compile screenshot module
        env:
          JAVA_HOME: ${{ steps.jdk21.outputs.path }}
        run: ./gradlew :screenshot:compileDebugKotlin --stacktrace
