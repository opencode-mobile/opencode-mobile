name: Distribute From PR Comment

# Comment `/distribute`, `/distribute android`, or `/distribute ios` on a pull
# request to send that PR's head commit to the Firebase tester groups. Only the
# repository maintainer's comments are honoured. `/distribute hex`,
# `/distribute hex android`, or `/distribute hex ios` sends Hex Code instead
# (hexcode-app-distribution.yml).

on:
  issue_comment:
    types:
      - created

permissions: {}

jobs:
  dispatch:
    if: >-
      github.repository == 'opencode-mobile/opencode-mobile' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/distribute') &&
      github.event.comment.user.login == 'ivanfenenko'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENT_ID: ${{ github.event.comment.id }}
      PR_NUMBER: ${{ github.event.issue.number }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Dispatch distribution workflows
        shell: bash
        run: |
          set -euo pipefail
          first_line="$(head -n 1 <<<"$COMMENT_BODY" | tr -d '\r')"
          read -r command target hex_target _ <<<"$first_line"
          if [[ "$command" != "/distribute" ]]; then
            exit 0
          fi
          usage="Use \`/distribute\`, \`/distribute android\`, \`/distribute ios\`, \`/distribute hex\`, \`/distribute hex android\`, or \`/distribute hex ios\`."
          # Set only for Hex Code, whose one workflow takes the platform as an input.
          hex_platform=""
          case "${target:-all}" in
            all) platforms=(android ios) ;;
            android) platforms=(android) ;;
            ios) platforms=(ios) ;;
            hex)
              hex_platform="${hex_target:-all}"
              case "$hex_platform" in
                all) platforms=(android ios) ;;
                android) platforms=(android) ;;
                ios) platforms=(ios) ;;
                *)
                  gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                    --body "Unknown target \`$target $hex_target\`. $usage"
                  exit 0
                  ;;
              esac
              ;;
            *)
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "Unknown target \`$target\`. $usage"
              exit 0
              ;;
          esac

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          state="$(jq -r '.state' <<<"$pr_json")"
          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "Distribution only runs for branches in this repository, not forks."
            exit 0
          fi
          if [[ "$state" != "open" ]]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "This pull request is not open."
            exit 0
          fi

          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" -f content=rocket >/dev/null || true
          if [[ -n "$hex_platform" ]]; then
            gh workflow run hexcode-app-distribution.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$DEFAULT_BRANCH" \
              -f platform="$hex_platform" \
              -f source_ref="$head_sha"
            distributing="Hex Code: ${platforms[*]}"
          else
            for platform in "${platforms[@]}"; do
              gh workflow run "$platform-app-distribution.yml" \
                --repo "$GITHUB_REPOSITORY" \
                --ref "$DEFAULT_BRANCH" \
                -f source_ref="$head_sha"
            done
            distributing="${platforms[*]}"
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Distributing \`${head_sha:0:12}\` ($distributing). Progress: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"
