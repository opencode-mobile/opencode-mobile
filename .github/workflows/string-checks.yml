name: String Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Path filters live here, not under `on:`: a merge queue ignores `paths`, and
    # a workflow that never starts leaves a required check pending. A job
    # skipped by `if:` reports as skipped, which counts as passing.
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.match.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Match changed paths
        id: match
        env:
          EVENT: ${{ github.event_name }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PATTERNS: |
            android/app/src/main/**
            ios/OpenCode Mobile/OpenCode Mobile/**
            # Shared with Hex Code; its text and keys come from OpenCode Mobile's catalog.
            ios/OpenCodeKit/**
            # Hex Code's key pair, reported (not failing) by check-string-keys.mjs.
            android/hexcode/src/main/res/**
            ios/OpenCode Mobile/Hex Code/**
            scripts/check-string-keys.mjs
            scripts/check-hardcoded-text.mjs
            scripts/check-theme-presets.mjs
            scripts/check-icons.mjs
            scripts/lib/**
            shared/theme-presets/**
            shared/syntax-presets/**
            icons/**
            release-notes/**
            scripts/release-notes.mjs
            package.json
            package-lock.json
            .github/workflows/string-checks.yml
            .github/scripts/changed-paths.py
        run: python3 .github/scripts/changed-paths.py

  strings:
    # GitHub-hosted on purpose: plain Node scripts with no dependencies or secrets.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails when a key exists on one platform but not the other (#886).
      - name: String key parity
        run: node scripts/check-string-keys.mjs

      # The in-app What's new sheet reads this file on both platforms.
      - name: Release notes
        run: node scripts/release-notes.mjs validate

      # Fails on any user-facing literal in feature code (#886). The step summary lists
      # every finding (path:line) and is written before the step's exit status is returned.
      - name: Hardcoded text
        run: |
          set +e
          node scripts/check-hardcoded-text.mjs --strict --list > hardcoded-text.txt 2>&1
          status=$?
          set -e
          cat hardcoded-text.txt
          {
            echo '### Hardcoded text'
            echo '```'
            cat hardcoded-text.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            total=$(sed -n 's/^Total: //p' hardcoded-text.txt)
            echo "::error title=Hardcoded text::${total:-Some} user-facing literal(s) in feature code. Move them to strings.xml / Localizable.xcstrings with matching keys."
          fi
          exit "$status"

  generated-assets:
    # Theme presets and icons are generated from shared sources; fail when the
    # committed platform copies drift from them.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install script dependencies
        run: npm ci --ignore-scripts

      - name: Theme presets match shared sources
        run: npm run themes:check

      - name: Icon outputs match manifest
        run: npm run icons:check
