name: String Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "android/app/src/main/**"
      - "ios/OpenCode Mobile/OpenCode Mobile/**"
      - "scripts/check-string-keys.mjs"
      - "scripts/check-hardcoded-text.mjs"
      - "scripts/check-theme-presets.mjs"
      - "scripts/check-icons.mjs"
      - "scripts/lib/**"
      - "shared/theme-presets/**"
      - "shared/syntax-presets/**"
      - "icons/**"
      - "release-notes/**"
      - "scripts/release-notes.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/string-checks.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strings:
    # GitHub-hosted on purpose: plain Node scripts with no dependencies or secrets.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails when a key exists on one platform but not the other (#886).
      - name: String key parity
        run: node scripts/check-string-keys.mjs

      # The in-app What's new sheet reads this file on both platforms.
      - name: Release notes
        run: node scripts/release-notes.mjs validate

      # Warning only while existing text is extracted; becomes --strict once done (#886).
      - name: Hardcoded text (warning only)
        run: |
          node scripts/check-hardcoded-text.mjs | tee hardcoded-text.txt
          total=$(sed -n 's/^Total: //p' hardcoded-text.txt)
          echo "::warning title=Hardcoded text::${total} user-facing literal(s) still in feature code"
          {
            echo '### Hardcoded text'
            echo '```'
            cat hardcoded-text.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  generated-assets:
    # Theme presets and icons are generated from shared sources; fail when the
    # committed platform copies drift from them.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install script dependencies
        run: npm ci --ignore-scripts

      - name: Theme presets match shared sources
        run: npm run themes:check

      - name: Icon outputs match manifest
        run: npm run icons:check
