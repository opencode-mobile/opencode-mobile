name: Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'opencode-mobile/opencode-mobile'
    runs-on: [self-hosted, Linux, X64, android]
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android compile SDK 37
        working-directory: .
        run: ./scripts/ensure-android-platform.sh 37

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
