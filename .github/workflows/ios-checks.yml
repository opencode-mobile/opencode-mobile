name: iOS Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      run_markdown_core_ios_tests:
        description: "Also run markdown-core libonig Kotlin/Native iOS tests (~2–3 min)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: blacksmith-6vcpu-macos-15
    defaults:
      run:
        working-directory: ios/OpenCode Mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Soft-disabled on PRs to save macOS minutes. Android Joni covers shared
      # highlighter logic; this step uniquely covers libonig / Kotlin/Native.
      # Re-enable on every PR: change the if below to always().
      # One-off: Actions → iOS Checks → Run workflow → enable the input.
      - name: Run markdown-core libonig iOS tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_markdown_core_ios_tests }}
        working-directory: android
        run: ./gradlew :markdown-core:iosSimulatorArm64Test --stacktrace

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "OpenCode Mobile.xcodeproj" \
            -scheme "OpenCode Mobile"

      - name: Select iOS Simulator
        id: simulator
        run: bash ../../.github/scripts/select-ios-simulator.sh

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project "OpenCode Mobile.xcodeproj" \
            -scheme "OpenCode Mobile" \
            -configuration Debug \
            -destination "${{ steps.simulator.outputs.destination }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run static analyzer
        run: |
          xcodebuild analyze \
            -project "OpenCode Mobile.xcodeproj" \
            -scheme "OpenCode Mobile" \
            -configuration Debug \
            -destination "${{ steps.simulator.outputs.destination }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project "OpenCode Mobile.xcodeproj" \
            -scheme "OpenCode Mobile" \
            -configuration Debug \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -only-testing:"OpenCode MobileTests" \
            CODE_SIGNING_ALLOWED=NO
