openapi: 3.1.0
info:
  title: opencode projects
  description: Projects API subset for opencode-mobile (directory scoping undocumented on /doc).
  version: 1.0.0
servers:
  - url: http://127.0.0.1:4096
paths:
  /global/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /path:
    get:
      operationId: getPaths
      responses:
        "200":
          description: Server path info (home, directory, worktree)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Path"
  /file:
    get:
      operationId: listFiles
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Files and directories under path
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileNode"
  /project:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Project catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
  /project/current:
    get:
      operationId: getCurrentProject
      parameters:
        - name: directory
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Current project for scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
components:
  schemas:
    Health:
      type: object
      required: [healthy]
      properties:
        healthy:
          type: boolean
        version:
          type: string
    Path:
      type: object
      required: [home, worktree, directory]
      properties:
        home:
          type: string
        state:
          type: string
        config:
          type: string
        worktree:
          type: string
        directory:
          type: string
    FileNode:
      type: object
      required: [name, path, absolute, type, ignored]
      properties:
        name:
          type: string
        path:
          type: string
        absolute:
          type: string
        type:
          type: string
          enum: [file, directory]
        ignored:
          type: boolean
    Project:
      type: object
      required: [id, worktree]
      properties:
        id:
          type: string
        worktree:
          type: string
        vcs:
          type: string
