openapi: 3.1.0
info:
  title: opencode projects
  description: Projects API subset for opencode-mobile (directory scoping undocumented on /doc).
  version: 1.0.0
servers:
  - url: http://127.0.0.1:4096
paths:
  /global/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /project:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Project catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
  /project/current:
    get:
      operationId: getCurrentProject
      parameters:
        - name: directory
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Current project for scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
components:
  schemas:
    Health:
      type: object
      required: [healthy]
      properties:
        healthy:
          type: boolean
        version:
          type: string
    Project:
      type: object
      required: [id, worktree]
      properties:
        id:
          type: string
        worktree:
          type: string
        vcs:
          type: string
